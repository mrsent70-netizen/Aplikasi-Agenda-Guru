/* ------------------------------------------------------------------ */
/* Komponen utama                                                      */
/* ------------------------------------------------------------------ */
function AgendaGuruApp() {
  const [tab, setTab] = useState('cover');
  const [cover, setCover] = useState(defaultCover);
  const [jadwal, setJadwal] = useState({
    ganjil: { tp: '2025/2026', days: buildDefaultDays() },
    genap: { tp: '2025/2026', days: buildDefaultDays() },
  });
  const [agenda, setAgenda] = useState(buildDefaultAgenda());
  const [siswa, setSiswa] = useState({});
  const [kelasBaru, setKelasBaru] = useState('');
  const [openAbsenId, setOpenAbsenId] = useState(null);
  const [filterTgl, setFilterTgl] = useState('');
  const [filterTeks, setFilterTeks] = useState('');
  const [status, setStatus] = useState('idle');
  const [loaded, setLoaded] = useState(false);
  const saveTimer = useRef(null);
  const [previewMode, setPreviewMode] = useState(false);
  const [isPrinting, setIsPrinting] = useState(false);
  const [syncStatus, setSyncStatus] = useState(API_URL ? 'connecting' : 'off');
  const lastUpdatedRef = useRef(0);
  const skipNextSaveRef = useRef(false);

  useEffect(() => {
    const before = () => setIsPrinting(true);
    const after = () => setIsPrinting(false);
    window.addEventListener('beforeprint', before);
    window.addEventListener('afterprint', after);
    return () => {
      window.removeEventListener('beforeprint', before);
      window.removeEventListener('afterprint', after);
    };
  }, []);

  const BULAN_ID = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
  const formatTgl = (iso) => {
    if (!iso) return '-';
    const [y, m, d] = iso.split('-');
    const bulan = BULAN_ID[parseInt(m, 10) - 1] || m;
    return `${parseInt(d, 10)} ${bulan} ${y}`;
  };

  // Memperkirakan jumlah baris textarea berdasarkan konten
  const estimateRows = (text, charsPerLine = 24) => {
    if (!text) return 1;
    return text.split('\n').reduce((sum, line) => sum + Math.max(1, Math.ceil(line.length / charsPerLine)), 1);
  };

  const applyRemoteData = (dataStr) => {
    try {
      const data = JSON.parse(dataStr);
      skipNextSaveRef.current = true;
      if (data.cover) setCover(data.cover);
      if (data.jadwal) setJadwal(data.jadwal);
      if (data.agenda) setAgenda(data.agenda);
      if (data.siswa) setSiswa(data.siswa);
    } catch (e) {
      // data rusak/kosong, abaikan
    }
  };

  const fetchRemote = async (isInitial) => {
    if (!API_URL) return;
    try {
      setSyncStatus((s) => (isInitial ? 'connecting' : s));
      const res = await fetch(API_URL, { method: 'GET' });
      const json = await res.json();
      if (json.ok && json.data && json.updatedAt > lastUpdatedRef.current) {
        lastUpdatedRef.current = json.updatedAt;
        applyRemoteData(json.data);
      }
      setSyncStatus('online');
    } catch (e) {
      setSyncStatus('error');
    }
  };

  // Muat dari localStorage dulu (biar langsung kelihatan / offline-ready), lalu tarik dari server
  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const data = JSON.parse(raw);
        if (data.cover) setCover(data.cover);
        if (data.jadwal) setJadwal(data.jadwal);
        if (data.agenda) setAgenda(data.agenda);
        if (data.siswa) setSiswa(data.siswa);
      }
    } catch (e) {
      // abaikan, pakai default
    } finally {
      (async () => {
        await fetchRemote(true);
        setLoaded(true);
      })();
    }
  }, []);

  // Polling berkala + saat tab/aplikasi dibuka lagi (aktif), supaya HP ikut update
  useEffect(() => {
    if (!API_URL) return;
    const interval = setInterval(() => fetchRemote(false), 15000);
    const onVisible = () => {
      if (document.visibilityState === 'visible') fetchRemote(false);
    };
    document.addEventListener('visibilitychange', onVisible);
    window.addEventListener('focus', onVisible);
    return () => {
      clearInterval(interval);
      document.removeEventListener('visibilitychange', onVisible);
      window.removeEventListener('focus', onVisible);
    };
  }, []);

  useEffect(() => {
    if (!loaded) return;
    if (skipNextSaveRef.current) {
      skipNextSaveRef.current = false;
      return;
    }
    setStatus('saving');
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      const payload = { cover, jadwal, agenda, siswa };
      const payloadStr = JSON.stringify(payload);
      try {
        localStorage.setItem(STORAGE_KEY, payloadStr);
        setStatus('saved');
      } catch (e) {
        setStatus('error');
      }
      if (API_URL) {
        try {
          setSyncStatus('syncing');
          const res = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ data: payloadStr }),
          });
          const json = await res.json();
          if (json.ok) {
            lastUpdatedRef.current = json.updatedAt;
            setSyncStatus('online');
          } else {
            setSyncStatus('error');
          }
        } catch (e) {
          setSyncStatus('error');
        }
      }
    }, 500);
    return () => clearTimeout(saveTimer.current);
  }, [cover, jadwal, agenda, siswa, loaded]);

  const updateRow = (sem, day, id, field, value) => {
    setJadwal((prev) => ({
      ...prev,
      [sem]: { ...prev[sem], days: { ...prev[sem].days, [day]: prev[sem].days[day].map((r) => (r.id === id ? { ...r, [field]: value } : r)) } },
    }));
  };
  const addRow = (sem, day) => {
    setJadwal((prev) => {
      const rows = prev[sem].days[day];
      const newRow = { id: uid(day.slice(0, 2).toLowerCase()), no: String(rows.length), pukul: '', kegiatan: '' };
      return { ...prev, [sem]: { ...prev[sem], days: { ...prev[sem].days, [day]: [...rows, newRow] } } };
    });
  };
  const removeRow = (sem, day, id) => {
    setJadwal((prev) => {
      const rows = prev[sem].days[day];
      if (rows.length <= 1) return prev;
      return { ...prev, [sem]: { ...prev[sem], days: { ...prev[sem].days, [day]: rows.filter((r) => r.id !== id) } } };
    });
  };
  const setTp = (sem, value) => setJadwal((prev) => ({ ...prev, [sem]: { ...prev[sem], tp: value } }));

  const addKelas = () => {
    const nama = kelasBaru.trim();
    if (!nama || siswa[nama]) return;
    setSiswa((prev) => ({ ...prev, [nama]: [] }));
    setKelasBaru('');
  };
  const removeKelas = (nama) => {
    setSiswa((prev) => {
      const next = { ...prev };
      delete next[nama];
      return next;
    });
  };
  const setRosterText = (nama, text) => {
    const names = text.split('\n').map((s) => s.trim()).filter(Boolean);
    setSiswa((prev) => ({ ...prev, [nama]: names }));
  };

  const updateAgenda = (id, field, value) => setAgenda((prev) => prev.map((r) => (r.id === id ? { ...r, [field]: value } : r)));
  const addAgenda = () => {
    setAgenda((prev) => [
      ...prev,
      { id: uid('ag'), tanggal: new Date().toISOString().slice(0, 10), jamKe: '', kelas: '', kdRpp: '', kompetensi: '', x: '', y: '', selesai: '', absensi: '', absensiDetail: {}, keterangan: '' },
    ]);
  };
  const removeAgenda = (id) => setAgenda((prev) => (prev.length <= 1 ? prev : prev.filter((r) => r.id !== id)));

  const updateAbsenStatus = (rowId, nama, st) => {
    setAgenda((prev) => prev.map((r) => (r.id === rowId ? { ...r, absensiDetail: { ...(r.absensiDetail || {}), [nama]: st } } : r)));
  };

  const applyAbsen = (rowId) => {
    const row = agenda.find((r) => r.id === rowId);
    if (!row) return;
    const roster = siswa[row.kelas] || [];
    const detail = row.absensiDetail || {};
    const tidakHadir = roster.map((nama, i) => ({ no: i + 1, nama, st: detail[nama] || 'H' })).filter((s) => s.st !== 'H');
    const totalHadir = roster.length - tidakHadir.length;
    const lines = tidakHadir.map((s) => `${s.no}. ${s.nama} ( ${s.st} )`);
    const ringkasan = [...lines, `Hadir: ${totalHadir}/${roster.length}`].join('\n');
    updateAgenda(rowId, 'absensi', ringkasan);
    setOpenAbsenId(null);
  };

  const filteredAgenda = useMemo(() => {
    return agenda.filter((r) => {
      const okTgl = filterTgl ? r.tanggal === filterTgl : true;
      const okTeks = filterTeks ? (r.kelas + ' ' + r.kompetensi).toLowerCase().includes(filterTeks.toLowerCase()) : true;
      return okTgl && okTeks;
    });
  }, [agenda, filterTgl, filterTeks]);

  // Fungsi untuk membagi row ke halaman berdasarkan tinggi konten
  // Maksimal 8 row per halaman, tetapi bisa kurang jika row tinggi
  const MAX_ROWS_PER_PAGE = 8;
  
  const splitIntoPages = useCallback((rows) => {
    const pages = [];
    let currentPage = [];
    let currentHeight = 0;
    
    // Estimasi tinggi per row berdasarkan konten
    const estimateRowHeight = (row) => {
      let height = 1; // base height
      // Tambahkan tinggi berdasarkan konten di kolom kompetensi dan absensi
      const kompetensiLines = (row.kompetensi || '').split('\n').length;
      const absensiLines = (row.absensi || '').split('\n').length;
      height += Math.max(0, kompetensiLines - 1) * 0.6;
      height += Math.max(0, absensiLines - 1) * 0.6;
      // Tambahan untuk teks panjang yang wrap
      const kompetensiLength = (row.kompetensi || '').length;
      const absensiLength = (row.absensi || '').length;
      height += Math.floor(kompetensiLength / 60) * 0.3;
      height += Math.floor(absensiLength / 50) * 0.3;
      return Math.max(1, Math.min(4, height));
    };
    
    for (const row of rows) {
      const rowHeight = estimateRowHeight(row);
      
      // Jika menambahkan row ini melebihi max row atau tinggi, mulai halaman baru
      if (currentPage.length >= MAX_ROWS_PER_PAGE || (currentHeight + rowHeight > 8 && currentPage.length > 0)) {
        pages.push(currentPage);
        currentPage = [];
        currentHeight = 0;
      }
      
      currentPage.push(row);
      currentHeight += rowHeight;
    }
    
    if (currentPage.length > 0 || pages.length === 0) {
      pages.push(currentPage);
    }
    
    return pages;
  }, []);

  const agendaPages = useMemo(() => {
    const filtered = filteredAgenda;
    if (filtered.length === 0) return [[]];
    return splitIntoPages(filtered);
  }, [filteredAgenda, splitIntoPages]);

  const totalSlot = useMemo(() => DAYS.reduce((sum, d) => sum + jadwal.ganjil.days[d].filter((r) => r.no !== '-').length, 0), [jadwal]);

  const exportJson = () => {
    const blob = new Blob([JSON.stringify({ cover, jadwal, agenda, siswa }, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `agenda-guru-${(cover.namaGuru || 'guru').replace(/\s+/g, '-').toLowerCase()}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const statusLabel = status === 'saving' ? 'Menyimpan…' : status === 'saved' ? 'Tersimpan ✓' : status === 'error' ? 'Gagal menyimpan' : 'Siap';
  const syncLabel = { off: '', connecting: '🔄 Menghubungkan…', syncing: '☁️ Sinkron…', online: '☁️ Tersambung ✓', error: '⚠️ Sinkron gagal' }[syncStatus];
  const rowOpen = agenda.find((r) => r.id === openAbsenId);

  const doPrint = () => {
    const el = document.getElementById('page-size-style');
    if (el) el.textContent = `@page { size: A4 landscape; margin: 8mm 6mm 8mm 45mm; }`;
    setTimeout(() => window.print(), 30);
  };

  // Komponen row agenda untuk mengurangi duplikasi
  const AgendaRow = ({ row, index }) => {
    const rowClass = index % 2 === 0 ? 'agenda-row-even' : 'agenda-row-odd';
    return (
      <tr key={row.id} className={`agenda-row ${rowClass}`}>
        <td className="border border-green-700 p-0 col-tanggal">
          {isPrinting || previewMode ? (
            <div className="px-1 py-2 text-[11px]">{formatTgl(row.tanggal)}</div>
          ) : (
            <input type="date" value={row.tanggal} onChange={(e) => updateAgenda(row.id, 'tanggal', e.target.value)} className="w-full px-1 py-2 bg-transparent outline-none text-[11px]" />
          )}
        </td>
        <td className="border border-green-700 p-0 col-jam">
          <input value={row.jamKe} onChange={(e) => updateAgenda(row.id, 'jamKe', e.target.value)} placeholder="1-2" className="w-full px-1 py-2 bg-transparent outline-none text-center" />
        </td>
        <td className="border border-green-700 p-0 col-kelas">
          <input list="daftar-kelas" value={row.kelas} onChange={(e) => updateAgenda(row.id, 'kelas', e.target.value)} placeholder="IX A" className="w-full px-1 py-2 bg-transparent outline-none text-center" />
        </td>
        <td className="border border-green-700 p-0 col-kd">
          <input value={row.kdRpp} onChange={(e) => updateAgenda(row.id, 'kdRpp', e.target.value)} placeholder="3.1" className="w-full px-1 py-2 bg-transparent outline-none text-center" />
        </td>
        <td className="border border-green-700 p-0 col-kompetensi">
          <textarea value={row.kompetensi} onChange={(e) => updateAgenda(row.id, 'kompetensi', e.target.value)} placeholder="KD / indikator" rows={Math.max(1, estimateRows(row.kompetensi, 30))} className="w-full px-2 py-1 bg-transparent outline-none resize-none text-[11px]" />
        </td>
        <td className="border border-green-700 p-0 col-x">
          <input value={row.x} onChange={(e) => updateAgenda(row.id, 'x', e.target.value)} className="w-full text-center py-2 bg-transparent outline-none" />
        </td>
        <td className="border border-green-700 p-0 col-y">
          <input value={row.y} onChange={(e) => updateAgenda(row.id, 'y', e.target.value)} className="w-full text-center py-2 bg-transparent outline-none" />
        </td>
        <td className="border border-green-700 p-0 col-selesai">
          <input value={row.selesai} onChange={(e) => updateAgenda(row.id, 'selesai', e.target.value)} placeholder="Selesai / Belum" className="w-full px-1 py-2 bg-transparent outline-none text-[11px]" />
        </td>
        <td className="border border-green-700 p-0 col-absensi">
          <div className="flex items-start gap-1">
            <textarea value={row.absensi} onChange={(e) => updateAgenda(row.id, 'absensi', e.target.value)} placeholder="Hadir 32, atau klik ikon di samping" rows={Math.max(1, estimateRows(row.absensi, 35))} className="w-full px-1 py-1 bg-transparent outline-none text-[11px] resize-none" />
            <button onClick={() => setOpenAbsenId(row.id)} className="no-print shrink-0 mt-0.5 p-1 rounded hover:bg-green-100 text-green-700" title="Isi absensi per siswa">
              <Users size={13} />
            </button>
          </div>
        </td>
        <td className="border border-green-700 p-0 text-center col-action no-print">
          <button onClick={() => removeAgenda(row.id)} className="p-1.5 hover:bg-red-50 rounded text-red-500">
            <Trash2 size={12} />
          </button>
        </td>
      </tr>
    );
  };

  return (
    <div className={`min-h-screen bg-green-50 text-neutral-900 ${previewMode ? 'preview-mode' : ''}`}>
      {previewMode && (
        <div className="preview-toolbar">
          <span className="text-xs font-semibold">👁️ Mode Pratinjau — begini tampilan hasil cetak/PDF-nya</span>
          <button onClick={doPrint} className="px-3 py-1.5 rounded-full bg-white text-green-800 text-xs font-semibold">
            🖨️ Cetak / Simpan PDF
          </button>
          <button onClick={() => setPreviewMode(false)} className="px-3 py-1.5 rounded-full bg-green-700 border border-white/40 text-white text-xs font-semibold">
            ✏️ Kembali Edit
          </button>
        </div>
      )}

      <div className="no-print sticky top-0 z-30 bg-green-50/95 border-b border-green-200 backdrop-blur">
        <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-3 flex-wrap">
          <div className="flex items-center gap-3">
            <div className="w-9 h-9 rounded-full bg-green-800 text-white grid place-items-center font-judul font-bold text-lg">A</div>
            <div className="leading-tight">
              <div className="font-semibold text-sm tracking-wide">BUKU AGENDA GURU</div>
              <div className="text-[11px] text-neutral-500">SMPN 13 Bandar Lampung • Kurikulum Merdeka</div>
            </div>
          </div>
          <div className="flex items-center gap-2">
            <div className="flex flex-wrap p-1 bg-white rounded-full border border-green-200 shadow-sm">
              {[
                { k: 'cover', label: 'COVER', icon: BookOpen },
                { k: 'jadwal', label: 'JADWAL', icon: Clock3 },
                { k: 'siswa', label: 'SISWA', icon: Users },
                { k: 'agenda', label: 'AGENDA HARIAN', icon: CalendarDays },
              ].map((m) => {
                const Icon = m.icon;
                const active = tab === m.k;
                return (
                  <button key={m.k} onClick={() => setTab(m.k)} className={`px-3 py-1.5 rounded-full text-xs font-semibold tracking-wide flex items-center gap-1.5 transition ${active ? 'bg-green-700 text-white shadow' : 'text-neutral-600 hover:bg-green-100'}`}>
                    <Icon size={14} /> {m.label}
                  </button>
                );
              })}
            </div>
            <span className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-white border border-green-200 text-xs font-medium text-neutral-500">{statusLabel}</span>
            {syncLabel && (
              <span className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-white border border-green-200 text-xs font-medium text-neutral-500">{syncLabel}</span>
            )}
          </div>
        </div>
      </div>

      <div className="preview-body max-w-6xl mx-auto px-4 py-6 md:py-8">
        {tab === 'cover' && (
          <div className="cover-page-wrap">
          <div id="cover-content" className="mx-auto bg-green-100 border-2 border-green-700 rounded-2xl shadow-lg overflow-hidden cover-card print-avoid-break" style={{ maxWidth: 1020, width: '100%' }}>
            <div className="px-6 md:px-10 py-8 flex flex-row items-center gap-6 md:gap-8 cover-grid">
              <div className="flex-shrink-0 text-center cover-left" style={{ flex: '0 0 230px' }}>
                <img src="https://i.ibb.co.com/Zz9dbRD/logosmp13.png" alt="Logo SMPN 13 Bandar Lampung" className="w-20 h-20 md:w-24 md:h-24 object-contain mx-auto" />
                <div className="mt-3 font-judul">
                  <h1 className="text-2xl md:text-4xl font-bold text-neutral-900 leading-tight">AGENDA GURU</h1>
                  <h2 className="mt-1 text-sm md:text-base tracking-[0.2em] font-semibold text-green-800">TUGAS MENGAJAR</h2>
                  <div className="mt-3 w-16 h-1 bg-green-800 mx-auto rounded-full" />
                </div>
                <div className="mt-4 text-[10px] tracking-widest uppercase text-neutral-500 font-tubuh">Dokumen resmi guru<br />Diisi setiap hari mengajar</div>
              </div>

              <div className="flex-1 w-full bg-white/80 border-2 border-green-700 rounded-xl p-5 md:p-6 space-y-3 cover-right">
                {[
                  { label: 'Nama Guru', key: 'namaGuru', placeholder: 'Nama lengkap dengan gelar' },
                  { label: 'NIP / NUPTK', key: 'nip', placeholder: 'Nomor induk pegawai' },
                  { label: 'Mata Pelajaran', key: 'mapel', placeholder: 'Contoh: Matematika' },
                  { label: 'Nama Sekolah', key: 'sekolah', placeholder: 'Nama satuan pendidikan' },
                  { label: 'Alamat Sekolah', key: 'alamat', placeholder: 'Alamat lengkap sekolah', multiline: true },
                ].map((f) => (
                  <div key={f.key} className="flex flex-col md:flex-row md:items-end gap-2">
                    <div className="md:w-36 shrink-0 text-[11px] font-bold tracking-widest uppercase text-neutral-500">{f.label}</div>
                    <div className="flex-1 border-b-2 border-dashed border-green-700/60 pb-1">
                      {f.multiline ? (
                        <textarea value={cover[f.key]} onChange={(e) => setCover({ ...cover, [f.key]: e.target.value })} placeholder={f.placeholder} rows={3} className="w-full bg-transparent outline-none resize-none text-sm font-medium" />
                      ) : (
                        <input value={cover[f.key]} onChange={(e) => setCover({ ...cover, [f.key]: e.target.value })} placeholder={f.placeholder} className="w-full bg-transparent outline-none text-sm font-medium" />
                      )}
                    </div>
                  </div>
                ))}
              </div>
            </div>

            <div className="pb-6 flex flex-wrap justify-center gap-2 no-print">
              <span className="inline-flex items-center gap-1.5 px-4 py-2 rounded-full bg-green-700 text-white text-xs font-semibold">
                <Save size={14} /> {statusLabel}
              </span>
              <button onClick={exportJson} className="inline-flex items-center gap-1.5 px-4 py-2 rounded-full bg-white border border-green-300 text-xs font-medium">
                <Download size={14} /> Ekspor JSON
              </button>
              <button onClick={doPrint} className="inline-flex items-center gap-1.5 px-4 py-2 rounded-full bg-white border border-green-300 text-xs font-medium">
                🖨️ Cetak
              </button>
              <button onClick={() => setPreviewMode(true)} className="inline-flex items-center gap-1.5 px-4 py-2 rounded-full bg-green-700 text-white text-xs font-medium">
                👁️ Pratinjau
              </button>
            </div>
          </div>
          </div>
        )}

        {tab === 'jadwal' && (
          <div id="jadwal-content" className="space-y-8">
            <div className="bg-white border border-green-200 rounded-2xl p-4 md:p-6 text-xs md:text-sm leading-relaxed text-neutral-600 font-tubuh no-print flex flex-wrap items-center justify-between gap-3">
              <span>
                Jadwal setiap hari kini <b>independen</b>: jumlah jam, jam masuk-pulang, dan kegiatan (Upacara, IMTAQ, Istirahat, MBG + Sholat, dst) bisa berbeda-beda per hari. Baris kegiatan non-mengajar cukup ditandai dengan mengisi kolom <b>No</b> dengan tanda "-".
              </span>
              <div className="shrink-0 flex gap-2">
                <button onClick={doPrint} className="inline-flex items-center gap-1.5 px-4 py-2 rounded-full bg-white border border-green-300 text-xs font-medium">
                  🖨️ Cetak
                </button>
                <button onClick={() => setPreviewMode(true)} className="inline-flex items-center gap-1.5 px-4 py-2 rounded-full bg-green-700 text-white text-xs font-medium">
                  👁️ Pratinjau
                </button>
              </div>
            </div>

            {['ganjil', 'genap'].map((sem) => (
              <div key={sem} className="bg-green-100 border border-green-200 rounded-2xl p-4 md:p-6 print-avoid-break">
                <div className="mb-4 semester-header">
                  <h3 className="font-judul text-xl md:text-2xl font-bold text-neutral-900 text-center">JADWAL MENGAJAR SEMESTER {sem.toUpperCase()}</h3>
                  <div className="flex items-center justify-center gap-2 text-xs mt-1">
                    <span className="text-neutral-500">Tahun Pelajaran:</span>
                    <input value={jadwal[sem].tp} onChange={(e) => setTp(sem, e.target.value)} className="w-28 px-2 py-1 rounded-full border border-green-300 bg-white outline-none text-xs font-semibold" />
                  </div>
                </div>

                <div className="flex flex-col gap-3">
                  <div className="flex gap-3 overflow-x-auto pb-2 print-wrap justify-center">
                    {DAYS.slice(0, 3).map((day) => {
                      const rows = jadwal[sem].days[day];
                      return (
                        <div key={day} className="bg-white rounded-xl border border-green-300 overflow-hidden flex-shrink-0 day-card" style={{ minWidth: 230 }}>
                          <div className="px-3 py-2 bg-green-700 text-white flex items-center justify-between card-header">
                            <span className="font-bold text-xs tracking-widest">{day.toUpperCase()}</span>
                            <button onClick={() => addRow(sem, day)} className="p-1 rounded-full hover:bg-white/20 no-print" title="Tambah baris">
                              <Plus size={13} />
                            </button>
                          </div>
                          <table className="w-full text-[11px] border-collapse">
                            <thead>
                              <tr className="bg-green-50 text-neutral-500">
                                <th className="p-1 border border-green-100 w-7">No</th>
                                <th className="p-1 border border-green-100 w-20">Pukul</th>
                                <th className="p-1 border border-green-100">Kegiatan / Kelas</th>
                                <th className="p-1 border border-green-100 w-5 no-print" />
                              </tr>
                            </thead>
                            <tbody>
                              {rows.map((row) => {
                                const isBreak = row.no.trim() === '-';
                                return (
                                  <tr key={row.id} className={isBreak ? 'bg-yellow-50' : ''}>
                                    <td className="border border-green-100 p-0">
                                      <input value={row.no} onChange={(e) => updateRow(sem, day, row.id, 'no', e.target.value)} className="w-full text-center py-1 bg-transparent outline-none font-semibold" />
                                    </td>
                                    <td className="border border-green-100 p-0">
                                      <input value={row.pukul} onChange={(e) => updateRow(sem, day, row.id, 'pukul', e.target.value)} placeholder="00:00-00:00" className="w-full py-1 px-1 bg-transparent outline-none" />
                                    </td>
                                    <td className="border border-green-100 p-0">
                                      <input value={row.kegiatan} onChange={(e) => updateRow(sem, day, row.id, 'kegiatan', e.target.value)} placeholder={isBreak ? '' : 'Kelas'} className={`w-full py-1 px-1 bg-transparent outline-none ${isBreak ? 'italic font-medium text-green-700' : ''}`} />
                                    </td>
                                    <td className="border border-green-100 p-0 text-center no-print">
                                      <button onClick={() => removeRow(sem, day, row.id)} className="text-red-500 hover:bg-red-50 rounded p-1" title="Hapus baris">
                                        <Trash2 size={11} />
                                      </button>
                                    </td>
                                  </tr>
                                );
                              })}
                            </tbody>
                          </table>
                        </div>
                      );
                    })}
                  </div>
                  <div className="flex gap-3 overflow-x-auto pb-2 print-wrap justify-center">
                    {DAYS.slice(3, 5).map((day) => {
                      const rows = jadwal[sem].days[day];
                      return (
                        <div key={day} className="bg-white rounded-xl border border-green-300 overflow-hidden flex-shrink-0 day-card" style={{ minWidth: 230 }}>
                          <div className="px-3 py-2 bg-green-700 text-white flex items-center justify-between card-header">
                            <span className="font-bold text-xs tracking-widest">{day.toUpperCase()}</span>
                            <button onClick={() => addRow(sem, day)} className="p-1 rounded-full hover:bg-white/20 no-print" title="Tambah baris">
                              <Plus size={13} />
                            </button>
                          </div>
                          <table className="w-full text-[11px] border-collapse">
                            <thead>
                              <tr className="bg-green-50 text-neutral-500">
                                <th className="p-1 border border-green-100 w-7">No</th>
                                <th className="p-1 border border-green-100 w-20">Pukul</th>
                                <th className="p-1 border border-green-100">Kegiatan / Kelas</th>
                                <th className="p-1 border border-green-100 w-5 no-print" />
                              </tr>
                            </thead>
                            <tbody>
                              {rows.map((row) => {
                                const isBreak = row.no.trim() === '-';
                                return (
                                  <tr key={row.id} className={isBreak ? 'bg-yellow-50' : ''}>
                                    <td className="border border-green-100 p-0">
                                      <input value={row.no} onChange={(e) => updateRow(sem, day, row.id, 'no', e.target.value)} className="w-full text-center py-1 bg-transparent outline-none font-semibold" />
                                    </td>
                                    <td className="border border-green-100 p-0">
                                      <input value={row.pukul} onChange={(e) => updateRow(sem, day, row.id, 'pukul', e.target.value)} placeholder="00:00-00:00" className="w-full py-1 px-1 bg-transparent outline-none" />
                                    </td>
                                    <td className="border border-green-100 p-0">
                                      <input value={row.kegiatan} onChange={(e) => updateRow(sem, day, row.id, 'kegiatan', e.target.value)} placeholder={isBreak ? '' : 'Kelas'} className={`w-full py-1 px-1 bg-transparent outline-none ${isBreak ? 'italic font-medium text-green-700' : ''}`} />
                                    </td>
                                    <td className="border border-green-100 p-0 text-center no-print">
                                      <button onClick={() => removeRow(sem, day, row.id)} className="text-red-500 hover:bg-red-50 rounded p-1" title="Hapus baris">
                                        <Trash2 size={11} />
                                      </button>
                                    </td>
                                  </tr>
                                );
                              })}
                            </tbody>
                          </table>
                        </div>
                      );
                    })}
                  </div>
                </div>

                <div className="px-1 pt-3 text-[10px] text-neutral-500">
                  Semester {sem === 'ganjil' ? 'Ganjil' : 'Genap'} • Tahun Pelajaran {jadwal[sem].tp}
                </div>
                <TandaTangan cover={cover} />
              </div>
            ))}
          </div>
        )}

        {tab === 'siswa' && (
          <div className="space-y-4">
            <div className="bg-white border border-green-200 rounded-2xl p-4 md:p-6 text-xs md:text-sm leading-relaxed text-neutral-600 font-tubuh">
              Buat daftar nama siswa per kelas di sini. Daftar ini dipakai saat mengisi <b>Absensi</b> di tab Agenda Harian, supaya tinggal pilih status kehadiran tiap anak (H/S/I/A) tanpa ketik ulang nama.
            </div>

            <div className="bg-green-100 border border-green-200 rounded-2xl p-4 md:p-6">
              <div className="flex flex-wrap gap-2 items-center mb-4">
                <input value={kelasBaru} onChange={(e) => setKelasBaru(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && addKelas()} placeholder="Nama kelas baru, contoh: IX A" className="px-3 py-2 rounded-full border border-green-300 bg-white outline-none text-sm flex-1 min-w-[180px]" />
                <button onClick={addKelas} className="px-4 py-2 rounded-full bg-green-700 text-white text-xs font-semibold inline-flex items-center gap-1">
                  <Plus size={14} /> Tambah Kelas
                </button>
              </div>

              {Object.keys(siswa).length === 0 && <p className="text-xs text-neutral-500">Belum ada kelas. Tambahkan kelas dulu di atas.</p>}

              <div className="grid md:grid-cols-2 gap-4">
                {Object.entries(siswa).map(([namaKelas, daftar]) => (
                  <div key={namaKelas} className="bg-white rounded-xl border border-green-300 overflow-hidden">
                    <div className="px-3 py-2 bg-green-700 text-white flex items-center justify-between">
                      <span className="font-bold text-xs tracking-widest">{namaKelas.toUpperCase()} • {daftar.length} siswa</span>
                      <button onClick={() => removeKelas(namaKelas)} className="p-1 rounded-full hover:bg-white/20" title="Hapus kelas">
                        <Trash2 size={13} />
                      </button>
                    </div>
                    <textarea defaultValue={daftar.join('\n')} onBlur={(e) => setRosterText(namaKelas, e.target.value)} placeholder={'Satu nama per baris, contoh:\nANDRE\nSISKA'} rows={8} className="w-full p-3 text-sm outline-none resize-none" />
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}

        {tab === 'agenda' && (
          <div id="agenda-content" className="bg-green-100 border border-green-200 rounded-2xl p-4 md:p-6">
            <div className="flex flex-wrap items-center justify-between gap-3">
              <div className="no-print">
                <h3 className="font-judul text-xl md:text-2xl font-bold">Agenda Harian Mengajar</h3>
                <p className="text-[11px] text-neutral-500 mt-1">Diisi setiap hari mengajar, sesuai jam pada jadwal</p>
                <p className="text-[10px] text-neutral-400 mt-0.5">Jumlah row per halaman menyesuaikan dengan tinggi konten (maksimal 8 row)</p>
              </div>
              <div className="no-print flex flex-wrap items-center gap-2">
                <div className="flex items-center gap-1.5 bg-white border border-green-300 rounded-full px-2 py-1">
                  <SearchIcon size={13} className="text-neutral-400" />
                  <input value={filterTeks} onChange={(e) => setFilterTeks(e.target.value)} placeholder="Cari kelas / materi" className="w-36 md:w-44 outline-none text-xs bg-transparent" />
                </div>
                <input type="date" value={filterTgl} onChange={(e) => setFilterTgl(e.target.value)} className="px-2 py-1.5 rounded-full border border-green-300 bg-white text-xs" />
                {filterTgl && <button onClick={() => setFilterTgl('')} className="text-[11px] underline">Reset</button>}
                <button onClick={addAgenda} className="px-3 py-1.5 rounded-full bg-green-700 text-white text-xs font-semibold inline-flex items-center gap-1">
                  <Plus size={14} /> Tambah Baris
                </button>
                <button onClick={exportJson} className="px-3 py-1.5 rounded-full bg-white border border-green-300 text-xs font-medium inline-flex items-center gap-1">
                  <Download size={12} /> Ekspor
                </button>
                <button onClick={doPrint} className="px-3 py-1.5 rounded-full bg-white border border-green-300 text-xs font-medium">
                  🖨️ Cetak
                </button>
                <button onClick={() => setPreviewMode(true)} className="px-3 py-1.5 rounded-full bg-green-700 text-white text-xs font-semibold">
                  👁️ Pratinjau
                </button>
              </div>
            </div>

            {agendaPages.map((pageRows, pageIdx) => (
              <div key={pageIdx} className={`agenda-page-container ${pageIdx > 0 ? 'page-top-gap' : ''}`}>
                <div className="hidden print-only-title">
                  <h3 className="font-judul text-xl font-bold">Agenda Harian Mengajar</h3>
                  <p className="text-[11px] text-neutral-500">SMP Negeri 13 Bandar Lampung • Halaman {pageIdx + 1} dari {agendaPages.length}</p>
                </div>
                <div className="mt-3 rounded-xl border border-green-700 bg-white overflow-hidden agenda-table-wrapper">
                  <table className="w-full border-collapse agenda-table">
                    <thead>
                      <tr className="bg-green-700 text-white text-[10px] tracking-wide">
                        <th className="p-1.5 border border-green-800 col-tanggal">Tanggal</th>
                        <th className="p-1.5 border border-green-800 col-jam">Jam Ke</th>
                        <th className="p-1.5 border border-green-800 col-kelas">Kelas</th>
                        <th className="p-1.5 border border-green-800 col-kd">No. KD/RPP</th>
                        <th className="p-1.5 border border-green-800 col-kompetensi">Kompetensi Dasar / Indikator</th>
                        <th className="p-1.5 border border-green-800 col-x">X</th>
                        <th className="p-1.5 border border-green-800 col-y">Y</th>
                        <th className="p-1.5 border border-green-800 col-selesai">Selesai / Belum + Alasan</th>
                        <th className="p-1.5 border border-green-800 col-absensi">Absensi Siswa</th>
                        <th className="p-1.5 border border-green-800 col-action no-print"></th>
                      </tr>
                    </thead>
                    <tbody>
                      {pageRows.length === 0 ? (
                        <tr>
                          <td colSpan="10" className="text-center py-8 text-neutral-400 text-sm">Tidak ada data agenda yang sesuai filter</td>
                        </tr>
                      ) : (
                        pageRows.map((row, idx) => (
                          <AgendaRow key={row.id} row={row} index={idx} />
                        ))
                      )}
                    </tbody>
                  </table>
                  {pageIdx === 0 && (
                    <datalist id="daftar-kelas">
                      {Object.keys(siswa).map((k) => (
                        <option key={k} value={k} />
                      ))}
                    </datalist>
                  )}
                </div>
                {/* Tanda tangan muncul di setiap halaman agenda */}
                <TandaTangan cover={cover} />
              </div>
            ))}

            <div className="mt-4 grid md:grid-cols-3 gap-2 text-[11px] font-tubuh no-print">
              <div className="bg-white/80 rounded-lg border border-green-200 p-2">
                <b>X</b> = Banyak pertemuan untuk 1 KD • <b>Y</b> = Pertemuan ke- • <b>KD RPP</b> = Nomor KD & RPP
              </div>
              <div className="bg-white/80 rounded-lg border border-green-200 p-2">
                Klik ikon orang di kolom Absensi untuk mencentang H/S/I/A per siswa — ringkasan terisi otomatis (mis. "1. ANDRE ( A )").
              </div>
              <div className="bg-white/80 rounded-lg border border-green-200 p-2">
                Guru: <b>{cover.namaGuru || '-'}</b> • Mapel: <b>{cover.mapel || '-'}</b> • {totalSlot} slot jam mengajar/minggu (ganjil)
              </div>
            </div>

            <div className="mt-3 text-[10px] text-neutral-500 no-print">
              Total baris: {filteredAgenda.length} dari {agenda.length} • Halaman: {agendaPages.length} • Filter: {filterTgl || 'Semua tanggal'} {filterTeks ? `• Cari: ${filterTeks}` : ''}
            </div>
          </div>
        )}
      </div>

      {rowOpen && (
        <PanelAbsensi
          row={rowOpen}
          roster={siswa[rowOpen.kelas] || []}
          onUpdateStatus={(nama, st) => updateAbsenStatus(rowOpen.id, nama, st)}
          onApply={() => applyAbsen(rowOpen.id)}
          onClose={() => setOpenAbsenId(null)}
          onGoToSiswa={() => {
            setKelasBaru(rowOpen.kelas || '');
            setOpenAbsenId(null);
            setTab('siswa');
          }}
        />
      )}

      <div className="no-print max-w-6xl mx-auto px-4 pb-8 text-center text-[10px] text-neutral-400">
        Aplikasi Buku Agenda Guru • SMPN 13 Bandar Lampung • Data tersimpan otomatis di browser (localStorage)
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<AgendaGuruApp />);
</script>
<script>
  (function () {
    var src = document.getElementById('app-source').textContent;
    var result = Babel.transform(src, { presets: [['react', { runtime: 'classic' }], 'env'] });
    var script = document.createElement('script');
    script.text = result.code;
    document.body.appendChild(script);
  })();
</script>
</body>
</html>
