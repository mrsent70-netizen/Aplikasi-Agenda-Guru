<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Buku Agenda Guru - SMPN 13 Bandar Lampung</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:wght@600;700&family=Inter:wght@400;500;600&display=swap');
  body { font-family: 'Inter', system-ui, sans-serif; }
  .font-judul { font-family: 'EB Garamond', Georgia, serif; }
  .font-tubuh { font-family: 'Inter', system-ui, sans-serif; }
  @media print {
    .no-print { display: none !important; }
    body { background: white !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;

/* ------------------------------------------------------------------ */
/* Ikon sederhana (gaya lucide), tidak butuh paket npm/bundler          */
/* ------------------------------------------------------------------ */
function IconBase({ paths, size = 16, className = '', ...rest }) {
  return (
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width={size}
      height={size}
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      strokeWidth="2"
      strokeLinecap="round"
      strokeLinejoin="round"
      className={className}
      {...rest}
    >
      {paths.map(([tag, props], i) => React.createElement(tag, { key: i, ...props }))}
    </svg>
  );
}
const BookOpen = (p) => <IconBase {...p} paths={[
  ['path', { d: 'M12 7v14' }],
  ['path', { d: 'M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z' }],
]} />;
const CalendarDays = (p) => <IconBase {...p} paths={[
  ['path', { d: 'M8 2v4' }], ['path', { d: 'M16 2v4' }],
  ['rect', { width: 18, height: 18, x: 3, y: 4, rx: 2 }],
  ['path', { d: 'M3 10h18' }], ['path', { d: 'M8 14h.01' }], ['path', { d: 'M12 14h.01' }],
  ['path', { d: 'M16 14h.01' }], ['path', { d: 'M8 18h.01' }], ['path', { d: 'M12 18h.01' }], ['path', { d: 'M16 18h.01' }],
]} />;
const Clock3 = (p) => <IconBase {...p} paths={[
  ['circle', { cx: 12, cy: 12, r: 10 }], ['polyline', { points: '12 6 12 12 16.5 12' }],
]} />;
const Download = (p) => <IconBase {...p} paths={[
  ['path', { d: 'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4' }],
  ['polyline', { points: '7 10 12 15 17 10' }],
  ['line', { x1: 12, x2: 12, y1: 15, y2: 3 }],
]} />;
const Plus = (p) => <IconBase {...p} paths={[
  ['path', { d: 'M5 12h14' }], ['path', { d: 'M12 5v14' }],
]} />;
const Save = (p) => <IconBase {...p} paths={[
  ['path', { d: 'M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z' }],
  ['path', { d: 'M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7' }],
  ['path', { d: 'M7 3v4a1 1 0 0 0 1 1h7' }],
]} />;
const SearchIcon = (p) => <IconBase {...p} paths={[
  ['circle', { cx: 11, cy: 11, r: 8 }], ['path', { d: 'm21 21-4.3-4.3' }],
]} />;
const Trash2 = (p) => <IconBase {...p} paths={[
  ['path', { d: 'M3 6h18' }],
  ['path', { d: 'M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6' }],
  ['path', { d: 'M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2' }],
  ['line', { x1: 10, x2: 10, y1: 11, y2: 17 }],
  ['line', { x1: 14, x2: 14, y1: 11, y2: 17 }],
]} />;

/* ------------------------------------------------------------------ */
/* Data & util                                                         */
/* ------------------------------------------------------------------ */
const STORAGE_KEY = 'agenda-guru-smpn13-data';
const DAYS = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat'];

let uidCounter = 1;
const uid = (prefix) => `${prefix}-${Date.now().toString(36)}-${uidCounter++}`;

function buildDefaultDays() {
  return {
    Senin: [
      { id: uid('sn'), no: '0', pukul: '07:00-08:15', kegiatan: 'Upacara + IMTAQ' },
      { id: uid('sn'), no: '1', pukul: '08:15-08:55', kegiatan: '' },
      { id: uid('sn'), no: '2', pukul: '08:55-09:35', kegiatan: '' },
      { id: uid('sn'), no: '-', pukul: '09:35-10:05', kegiatan: 'Istirahat' },
      { id: uid('sn'), no: '3', pukul: '10:05-10:45', kegiatan: '' },
      { id: uid('sn'), no: '4', pukul: '10:45-11:25', kegiatan: '' },
      { id: uid('sn'), no: '-', pukul: '11:25-12:25', kegiatan: 'MBG + Sholat' },
      { id: uid('sn'), no: '5', pukul: '12:25-13:05', kegiatan: '' },
      { id: uid('sn'), no: '6', pukul: '13:05-13:45', kegiatan: '' },
      { id: uid('sn'), no: '7', pukul: '13:45-14:25', kegiatan: '' },
      { id: uid('sn'), no: '8', pukul: '14:25-15:00', kegiatan: '' },
    ],
    Selasa: [
      { id: uid('sl'), no: '0', pukul: '07:00-07:40', kegiatan: 'IMTAQ' },
      { id: uid('sl'), no: '1', pukul: '07:40-08:20', kegiatan: '' },
      { id: uid('sl'), no: '2', pukul: '08:20-09:00', kegiatan: '' },
      { id: uid('sl'), no: '3', pukul: '09:00-09:40', kegiatan: '' },
      { id: uid('sl'), no: '-', pukul: '09:40-10:10', kegiatan: 'Istirahat' },
      { id: uid('sl'), no: '4', pukul: '10:10-10:50', kegiatan: '' },
      { id: uid('sl'), no: '5', pukul: '10:50-11:30', kegiatan: '' },
      { id: uid('sl'), no: '-', pukul: '11:30-12:30', kegiatan: 'MBG + Sholat' },
      { id: uid('sl'), no: '6', pukul: '12:30-13:10', kegiatan: '' },
      { id: uid('sl'), no: '7', pukul: '13:10-13:50', kegiatan: '' },
      { id: uid('sl'), no: '8', pukul: '13:50-14:25', kegiatan: '' },
      { id: uid('sl'), no: '9', pukul: '14:25-15:00', kegiatan: '' },
    ],
    Rabu: [
      { id: uid('rb'), no: '0', pukul: '07:00-08:15', kegiatan: 'Senam + IMTAQ' },
      { id: uid('rb'), no: '1', pukul: '08:15-08:55', kegiatan: '' },
      { id: uid('rb'), no: '2', pukul: '08:55-09:35', kegiatan: '' },
      { id: uid('rb'), no: '-', pukul: '09:35-10:10', kegiatan: 'Istirahat' },
      { id: uid('rb'), no: '3', pukul: '10:10-10:50', kegiatan: '' },
      { id: uid('rb'), no: '4', pukul: '10:50-11:30', kegiatan: '' },
      { id: uid('rb'), no: '-', pukul: '11:30-12:30', kegiatan: 'MBG + Sholat' },
      { id: uid('rb'), no: '5', pukul: '12:30-13:10', kegiatan: '' },
      { id: uid('rb'), no: '6', pukul: '13:10-13:50', kegiatan: '' },
      { id: uid('rb'), no: '7', pukul: '13:50-14:30', kegiatan: '' },
    ],
    Kamis: [
      { id: uid('km'), no: '0', pukul: '07:00-07:40', kegiatan: 'IMTAQ' },
      { id: uid('km'), no: '1', pukul: '07:40-08:20', kegiatan: '' },
      { id: uid('km'), no: '2', pukul: '08:20-09:00', kegiatan: '' },
      { id: uid('km'), no: '3', pukul: '09:00-09:40', kegiatan: '' },
      { id: uid('km'), no: '-', pukul: '09:40-10:10', kegiatan: 'Istirahat' },
      { id: uid('km'), no: '4', pukul: '10:10-10:50', kegiatan: '' },
      { id: uid('km'), no: '5', pukul: '10:50-11:30', kegiatan: '' },
      { id: uid('km'), no: '-', pukul: '11:30-12:30', kegiatan: 'MBG + Sholat' },
      { id: uid('km'), no: '6', pukul: '12:30-13:10', kegiatan: '' },
      { id: uid('km'), no: '7', pukul: '13:10-13:50', kegiatan: '' },
      { id: uid('km'), no: '8', pukul: '13:50-14:30', kegiatan: '' },
    ],
    Jumat: [
      { id: uid('jm'), no: '0', pukul: '07:00-08:00', kegiatan: 'Senam + IMTAQ' },
      { id: uid('jm'), no: '1', pukul: '08:00-08:30', kegiatan: '' },
      { id: uid('jm'), no: '2', pukul: '08:30-09:00', kegiatan: '' },
      { id: uid('jm'), no: '-', pukul: '09:00-09:30', kegiatan: 'Istirahat' },
      { id: uid('jm'), no: '3', pukul: '09:30-10:00', kegiatan: '' },
      { id: uid('jm'), no: '4', pukul: '10:00-10:30', kegiatan: '' },
      { id: uid('jm'), no: '-', pukul: '10:30-11:30', kegiatan: 'MBG + Pulang' },
    ],
  };
}

function buildDefaultAgenda() {
  return [
    { id: uid('ag'), tanggal: new Date().toISOString().slice(0, 10), jamKe: '', kelas: '', kdRpp: '', kompetensi: '', x: '', y: '', selesai: '', absensi: '', keterangan: '' },
  ];
}

const defaultCover = { namaGuru: '', nip: '', mapel: '', sekolah: 'SMP Negeri 13 Bandar Lampung', alamat: '' };

/* ------------------------------------------------------------------ */
/* Komponen utama                                                      */
/* ------------------------------------------------------------------ */
function AgendaGuruApp() {
  const [tab, setTab] = useState('cover');
  const [cover, setCover] = useState(defaultCover);
  const [jadwal, setJadwal] = useState({
    ganjil: { tp: '2025/2026', days: buildDefaultDays() },
    genap: { tp: '2025/2026', days: buildDefaultDays() },
  });
  const [agenda, setAgenda] = useState(buildDefaultAgenda());
  const [filterTgl, setFilterTgl] = useState('');
  const [filterTeks, setFilterTeks] = useState('');
  const [status, setStatus] = useState('idle');
  const [loaded, setLoaded] = useState(false);
  const saveTimer = useRef(null);

  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const data = JSON.parse(raw);
        if (data.cover) setCover(data.cover);
        if (data.jadwal) setJadwal(data.jadwal);
        if (data.agenda) setAgenda(data.agenda);
      }
    } catch (e) {
      // abaikan, pakai default
    } finally {
      setLoaded(true);
    }
  }, []);

  useEffect(() => {
    if (!loaded) return;
    setStatus('saving');
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ cover, jadwal, agenda }));
        setStatus('saved');
      } catch (e) {
        setStatus('error');
      }
    }, 500);
    return () => clearTimeout(saveTimer.current);
  }, [cover, jadwal, agenda, loaded]);

  const updateRow = (sem, day, id, field, value) => {
    setJadwal((prev) => ({
      ...prev,
      [sem]: {
        ...prev[sem],
        days: {
          ...prev[sem].days,
          [day]: prev[sem].days[day].map((r) => (r.id === id ? { ...r, [field]: value } : r)),
        },
      },
    }));
  };

  const addRow = (sem, day) => {
    setJadwal((prev) => {
      const rows = prev[sem].days[day];
      const newRow = { id: uid(day.slice(0, 2).toLowerCase()), no: String(rows.length), pukul: '', kegiatan: '' };
      return { ...prev, [sem]: { ...prev[sem], days: { ...prev[sem].days, [day]: [...rows, newRow] } } };
    });
  };

  const removeRow = (sem, day, id) => {
    setJadwal((prev) => {
      const rows = prev[sem].days[day];
      if (rows.length <= 1) return prev;
      return { ...prev, [sem]: { ...prev[sem], days: { ...prev[sem].days, [day]: rows.filter((r) => r.id !== id) } } };
    });
  };

  const setTp = (sem, value) => {
    setJadwal((prev) => ({ ...prev, [sem]: { ...prev[sem], tp: value } }));
  };

  const updateAgenda = (id, field, value) => {
    setAgenda((prev) => prev.map((r) => (r.id === id ? { ...r, [field]: value } : r)));
  };
  const addAgenda = () => {
    setAgenda((prev) => [
      { id: uid('ag'), tanggal: new Date().toISOString().slice(0, 10), jamKe: '', kelas: '', kdRpp: '', kompetensi: '', x: '', y: '', selesai: '', absensi: '', keterangan: '' },
      ...prev,
    ]);
  };
  const removeAgenda = (id) => {
    setAgenda((prev) => (prev.length <= 1 ? prev : prev.filter((r) => r.id !== id)));
  };

  const filteredAgenda = useMemo(() => {
    return agenda.filter((r) => {
      const okTgl = filterTgl ? r.tanggal === filterTgl : true;
      const okTeks = filterTeks ? (r.kelas + ' ' + r.kompetensi).toLowerCase().includes(filterTeks.toLowerCase()) : true;
      return okTgl && okTeks;
    });
  }, [agenda, filterTgl, filterTeks]);

  const totalSlot = useMemo(() => {
    return DAYS.reduce((sum, d) => sum + jadwal.ganjil.days[d].filter((r) => r.no !== '-').length, 0);
  }, [jadwal]);

  const exportJson = () => {
    const blob = new Blob([JSON.stringify({ cover, jadwal, agenda }, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `agenda-guru-${(cover.namaGuru || 'guru').replace(/\s+/g, '-').toLowerCase()}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const statusLabel = status === 'saving' ? 'Menyimpan…' : status === 'saved' ? 'Tersimpan ✓' : status === 'error' ? 'Gagal menyimpan' : 'Siap';

  return (
    <div className="min-h-screen bg-green-50 text-neutral-900">
      <div className="no-print sticky top-0 z-30 bg-green-50/95 border-b border-green-200 backdrop-blur">
        <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-3 flex-wrap">
          <div className="flex items-center gap-3">
            <div className="w-9 h-9 rounded-full bg-green-800 text-white grid place-items-center font-judul font-bold text-lg">A</div>
            <div className="leading-tight">
              <div className="font-semibold text-sm tracking-wide">BUKU AGENDA GURU</div>
              <div className="text-[11px] text-neutral-500">SMPN 13 Bandar Lampung • Kurikulum Merdeka</div>
            </div>
          </div>
          <div className="flex items-center gap-2">
            <div className="flex p-1 bg-white rounded-full border border-green-200 shadow-sm">
              {[
                { k: 'cover', label: 'COVER', icon: BookOpen },
                { k: 'jadwal', label: 'JADWAL', icon: Clock3 },
                { k: 'agenda', label: 'AGENDA HARIAN', icon: CalendarDays },
              ].map((m) => {
                const Icon = m.icon;
                const active = tab === m.k;
                return (
                  <button
                    key={m.k}
                    onClick={() => setTab(m.k)}
                    className={`px-3 py-1.5 rounded-full text-xs font-semibold tracking-wide flex items-center gap-1.5 transition ${
                      active ? 'bg-green-700 text-white shadow' : 'text-neutral-600 hover:bg-green-100'
                    }`}
                  >
                    <Icon size={14} /> {m.label}
                  </button>
                );
              })}
            </div>
            <span className="hidden md:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-white border border-green-200 text-xs font-medium text-neutral-500">
              {statusLabel}
            </span>
          </div>
        </div>
      </div>

      <div className="max-w-6xl mx-auto px-4 py-6 md:py-8">
        {tab === 'cover' && (
          <div className="max-w-2xl mx-auto bg-green-100 border-2 border-green-700 rounded-2xl shadow-lg overflow-hidden">
            <div className="px-6 md:px-10 pt-8 pb-10">
              <div className="flex justify-center mb-4">
                <img
                  src="https://i.ibb.co.com/Zz9dbRD/logosmp13.png"
                  alt="Logo SMPN 13 Bandar Lampung"
                  className="w-20 h-20 md:w-24 md:h-24 object-contain"
                />
              </div>
              <div className="text-center font-judul">
                <h1 className="text-3xl md:text-5xl font-bold text-neutral-900">AGENDA GURU</h1>
                <h2 className="mt-1 text-base md:text-xl tracking-[0.2em] font-semibold text-green-800">TUGAS MENGAJAR</h2>
                <div className="mt-3 w-24 h-1 bg-green-800 mx-auto rounded-full" />
              </div>

              <div className="mt-8 bg-white/80 border-2 border-green-700 rounded-xl p-5 md:p-8 space-y-5">
                {[
                  { label: 'Nama Guru', key: 'namaGuru', placeholder: 'Nama lengkap dengan gelar' },
                  { label: 'NIP / NUPTK', key: 'nip', placeholder: 'Nomor induk pegawai' },
                  { label: 'Mata Pelajaran', key: 'mapel', placeholder: 'Contoh: Matematika' },
                  { label: 'Nama Sekolah', key: 'sekolah', placeholder: 'Nama satuan pendidikan' },
                  { label: 'Alamat Sekolah', key: 'alamat', placeholder: 'Alamat lengkap sekolah', multiline: true },
                ].map((f) => (
                  <div key={f.key} className="flex flex-col md:flex-row md:items-end gap-2">
                    <div className="md:w-36 shrink-0 text-[11px] font-bold tracking-widest uppercase text-neutral-500">{f.label}</div>
                    <div className="flex-1 border-b-2 border-dashed border-green-700/60 pb-1">
                      {f.multiline ? (
                        <textarea
                          value={cover[f.key]}
                          onChange={(e) => setCover({ ...cover, [f.key]: e.target.value })}
                          placeholder={f.placeholder}
                          rows={2}
                          className="w-full bg-transparent outline-none resize-none text-sm md:text-base font-medium"
                        />
                      ) : (
                        <input
                          value={cover[f.key]}
                          onChange={(e) => setCover({ ...cover, [f.key]: e.target.value })}
                          placeholder={f.placeholder}
                          className="w-full bg-transparent outline-none text-sm md:text-base font-medium"
                        />
                      )}
                    </div>
                  </div>
                ))}
              </div>

              <div className="mt-6 flex flex-wrap gap-2 no-print">
                <span className="inline-flex items-center gap-1.5 px-4 py-2 rounded-full bg-green-700 text-white text-xs font-semibold">
                  <Save size={14} /> {statusLabel}
                </span>
                <button onClick={exportJson} className="inline-flex items-center gap-1.5 px-4 py-2 rounded-full bg-white border border-green-300 text-xs font-medium">
                  <Download size={14} /> Ekspor JSON
                </button>
              </div>
              <div className="mt-6 text-center text-[10px] tracking-widest uppercase text-neutral-400 font-tubuh">
                Dokumen resmi guru • Diisi setiap hari mengajar
              </div>
            </div>
          </div>
        )}

        {tab === 'jadwal' && (
          <div className="space-y-8">
            <div className="bg-white border border-green-200 rounded-2xl p-4 md:p-6 text-xs md:text-sm leading-relaxed text-neutral-600 font-tubuh">
              Jadwal setiap hari kini <b>independen</b>: jumlah jam, jam masuk-pulang, dan kegiatan (Upacara, IMTAQ, Istirahat, MBG + Sholat, dst) bisa berbeda-beda
              per hari. Baris kegiatan non-mengajar cukup ditandai dengan mengisi kolom <b>No</b> dengan tanda "-".
            </div>

            {['ganjil', 'genap'].map((sem) => (
              <div key={sem} className="bg-green-100 border border-green-200 rounded-2xl p-4 md:p-6">
                <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
                  <h3 className="font-judul text-xl md:text-2xl font-bold text-neutral-900">
                    JADWAL MENGAJAR SEMESTER {sem.toUpperCase()}
                  </h3>
                  <div className="flex items-center gap-2 text-xs">
                    <span className="text-neutral-500">Tahun Pelajaran:</span>
                    <input
                      value={jadwal[sem].tp}
                      onChange={(e) => setTp(sem, e.target.value)}
                      className="w-28 px-2 py-1 rounded-full border border-green-300 bg-white outline-none text-xs font-semibold"
                    />
                  </div>
                </div>

                <div className="flex gap-3 overflow-x-auto pb-2">
                  {DAYS.map((day) => {
                    const rows = jadwal[sem].days[day];
                    return (
                      <div key={day} className="bg-white rounded-xl border border-green-300 overflow-hidden flex-shrink-0" style={{ minWidth: 230 }}>
                        <div className="px-3 py-2 bg-green-700 text-white flex items-center justify-between">
                          <span className="font-bold text-xs tracking-widest">{day.toUpperCase()}</span>
                          <button onClick={() => addRow(sem, day)} className="p-1 rounded-full hover:bg-white/20 no-print" title="Tambah baris">
                            <Plus size={13} />
                          </button>
                        </div>
                        <table className="w-full text-[11px] border-collapse">
                          <thead>
                            <tr className="bg-green-50 text-neutral-500">
                              <th className="p-1 border border-green-100 w-7">No</th>
                              <th className="p-1 border border-green-100 w-20">Pukul</th>
                              <th className="p-1 border border-green-100">Kegiatan / Kelas</th>
                              <th className="p-1 border border-green-100 w-5 no-print" />
                            </tr>
                          </thead>
                          <tbody>
                            {rows.map((row) => {
                              const isBreak = row.no.trim() === '-';
                              return (
                                <tr key={row.id} className={isBreak ? 'bg-yellow-50' : ''}>
                                  <td className="border border-green-100 p-0">
                                    <input
                                      value={row.no}
                                      onChange={(e) => updateRow(sem, day, row.id, 'no', e.target.value)}
                                      className="w-full text-center py-1 bg-transparent outline-none font-semibold"
                                    />
                                  </td>
                                  <td className="border border-green-100 p-0">
                                    <input
                                      value={row.pukul}
                                      onChange={(e) => updateRow(sem, day, row.id, 'pukul', e.target.value)}
                                      placeholder="00:00-00:00"
                                      className="w-full py-1 px-1 bg-transparent outline-none"
                                    />
                                  </td>
                                  <td className="border border-green-100 p-0">
                                    <input
                                      value={row.kegiatan}
                                      onChange={(e) => updateRow(sem, day, row.id, 'kegiatan', e.target.value)}
                                      placeholder={isBreak ? '' : 'Kelas'}
                                      className={`w-full py-1 px-1 bg-transparent outline-none ${isBreak ? 'italic font-medium text-green-700' : ''}`}
                                    />
                                  </td>
                                  <td className="border border-green-100 p-0 text-center no-print">
                                    <button onClick={() => removeRow(sem, day, row.id)} className="text-red-500 hover:bg-red-50 rounded p-1" title="Hapus baris">
                                      <Trash2 size={11} />
                                    </button>
                                  </td>
                                </tr>
                              );
                            })}
                          </tbody>
                        </table>
                      </div>
                    );
                  })}
                </div>

                <div className="px-1 pt-3 text-[10px] text-neutral-500 flex justify-between flex-wrap gap-2">
                  <span>Tanda tangan Kepala Sekolah</span>
                  <span>Tanda tangan Guru Ybs: {cover.namaGuru || '..........................'}</span>
                </div>
              </div>
            ))}
          </div>
        )}

        {tab === 'agenda' && (
          <div className="bg-green-100 border border-green-200 rounded-2xl p-4 md:p-6">
            <div className="flex flex-wrap items-center justify-between gap-3">
              <div>
                <h3 className="font-judul text-xl md:text-2xl font-bold">Agenda Harian Mengajar</h3>
                <p className="text-[11px] text-neutral-500 mt-1">Diisi setiap hari mengajar, sesuai jam pada jadwal</p>
              </div>
              <div className="no-print flex flex-wrap items-center gap-2">
                <div className="flex items-center gap-1.5 bg-white border border-green-300 rounded-full px-2 py-1">
                  <SearchIcon size={13} className="text-neutral-400" />
                  <input
                    value={filterTeks}
                    onChange={(e) => setFilterTeks(e.target.value)}
                    placeholder="Cari kelas / materi"
                    className="w-36 md:w-44 outline-none text-xs bg-transparent"
                  />
                </div>
                <input
                  type="date"
                  value={filterTgl}
                  onChange={(e) => setFilterTgl(e.target.value)}
                  className="px-2 py-1.5 rounded-full border border-green-300 bg-white text-xs"
                />
                {filterTgl && (
                  <button onClick={() => setFilterTgl('')} className="text-[11px] underline">
                    Reset
                  </button>
                )}
                <button onClick={addAgenda} className="px-3 py-1.5 rounded-full bg-green-700 text-white text-xs font-semibold inline-flex items-center gap-1">
                  <Plus size={14} /> Tambah Baris
                </button>
                <button onClick={exportJson} className="px-3 py-1.5 rounded-full bg-white border border-green-300 text-xs font-medium inline-flex items-center gap-1">
                  <Download size={12} /> Ekspor
                </button>
              </div>
            </div>

            <div className="mt-4 grid md:grid-cols-3 gap-2 text-[11px] font-tubuh">
              <div className="bg-white/80 rounded-lg border border-green-200 p-2">
                <b>X</b> = Banyak pertemuan untuk 1 KD • <b>Y</b> = Pertemuan ke- • <b>KD RPP</b> = Nomor KD & RPP
              </div>
              <div className="bg-white/80 rounded-lg border border-green-200 p-2">
                Selesai / Belum: tulis alasan jika belum selesai. Absensi: S/I/A atau jumlah hadir.
              </div>
              <div className="bg-white/80 rounded-lg border border-green-200 p-2">
                Guru: <b>{cover.namaGuru || '-'}</b> • Mapel: <b>{cover.mapel || '-'}</b> • {totalSlot} slot jam mengajar/minggu (ganjil)
              </div>
            </div>

            <div className="mt-5 overflow-x-auto rounded-xl border border-green-700 bg-white">
              <table className="w-full text-[11px] border-collapse" style={{ minWidth: 1100 }}>
                <thead>
                  <tr className="bg-green-700 text-white text-[10px] tracking-wide">
                    <th className="p-2 border border-green-800 w-28">Tanggal</th>
                    <th className="p-2 border border-green-800 w-16">Jam Ke</th>
                    <th className="p-2 border border-green-800 w-24">Kelas</th>
                    <th className="p-2 border border-green-800 w-20">No. KD/RPP</th>
                    <th className="p-2 border border-green-800" style={{ minWidth: 220 }}>Kompetensi Dasar / Indikator</th>
                    <th className="p-2 border border-green-800 w-9">X</th>
                    <th className="p-2 border border-green-800 w-9">Y</th>
                    <th className="p-2 border border-green-800 w-32">Selesai / Belum + Alasan</th>
                    <th className="p-2 border border-green-800 w-28">Absensi Siswa</th>
                    <th className="p-2 border border-green-800 w-24">Keterangan</th>
                    <th className="p-1 border border-green-800 w-8 no-print" />
                  </tr>
                </thead>
                <tbody>
                  {filteredAgenda.map((row, i) => (
                    <tr key={row.id} className={i % 2 === 0 ? 'bg-white' : 'bg-green-50'}>
                      <td className="border border-green-100 p-0">
                        <input type="date" value={row.tanggal} onChange={(e) => updateAgenda(row.id, 'tanggal', e.target.value)} className="w-full px-1 py-2 bg-transparent outline-none text-[11px]" />
                      </td>
                      <td className="border border-green-100 p-0">
                        <input value={row.jamKe} onChange={(e) => updateAgenda(row.id, 'jamKe', e.target.value)} placeholder="1-2" className="w-full px-1 py-2 bg-transparent outline-none text-center" />
                      </td>
                      <td className="border border-green-100 p-0">
                        <input value={row.kelas} onChange={(e) => updateAgenda(row.id, 'kelas', e.target.value)} placeholder="IX A" className="w-full px-1 py-2 bg-transparent outline-none" />
                      </td>
                      <td className="border border-green-100 p-0">
                        <input value={row.kdRpp} onChange={(e) => updateAgenda(row.id, 'kdRpp', e.target.value)} placeholder="3.1" className="w-full px-1 py-2 bg-transparent outline-none text-center" />
                      </td>
                      <td className="border border-green-100 p-0">
                        <input value={row.kompetensi} onChange={(e) => updateAgenda(row.id, 'kompetensi', e.target.value)} placeholder="KD / indikator" className="w-full px-2 py-2 bg-transparent outline-none" />
                      </td>
                      <td className="border border-green-100 p-0">
                        <input value={row.x} onChange={(e) => updateAgenda(row.id, 'x', e.target.value)} className="w-full text-center py-2 bg-transparent outline-none" />
                      </td>
                      <td className="border border-green-100 p-0">
                        <input value={row.y} onChange={(e) => updateAgenda(row.id, 'y', e.target.value)} className="w-full text-center py-2 bg-transparent outline-none" />
                      </td>
                      <td className="border border-green-100 p-0">
                        <input value={row.selesai} onChange={(e) => updateAgenda(row.id, 'selesai', e.target.value)} placeholder="Selesai / Belum" className="w-full px-1 py-2 bg-transparent outline-none" />
                      </td>
                      <td className="border border-green-100 p-0">
                        <input value={row.absensi} onChange={(e) => updateAgenda(row.id, 'absensi', e.target.value)} placeholder="Hadir 32" className="w-full px-1 py-2 bg-transparent outline-none" />
                      </td>
                      <td className="border border-green-100 p-0">
                        <input value={row.keterangan} onChange={(e) => updateAgenda(row.id, 'keterangan', e.target.value)} className="w-full px-1 py-2 bg-transparent outline-none" />
                      </td>
                      <td className="border border-green-100 p-0 text-center no-print">
                        <button onClick={() => removeAgenda(row.id)} className="p-1.5 hover:bg-red-50 rounded text-red-500">
                          <Trash2 size={12} />
                        </button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

            <div className="mt-3 flex flex-wrap justify-between text-[10px] text-neutral-500 gap-2">
              <div>
                Total baris: {filteredAgenda.length} dari {agenda.length} • Filter: {filterTgl || 'Semua tanggal'} {filterTeks ? `• Cari: ${filterTeks}` : ''}
              </div>
              <div className="flex gap-4">
                <span>Paraf Guru: ........................</span>
                <span>Paraf Kepsek / Wakasek: ........................</span>
              </div>
            </div>
          </div>
        )}
      </div>

      <div className="no-print max-w-6xl mx-auto px-4 pb-8 text-center text-[10px] text-neutral-400">
        Aplikasi Buku Agenda Guru • SMPN 13 Bandar Lampung • Data tersimpan otomatis di browser (localStorage)
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<AgendaGuruApp />);
</script>
</body>
</html>
