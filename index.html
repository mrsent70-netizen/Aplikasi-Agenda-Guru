  <style>
    :root {
      --green-dark: #14532d;
      --green-main: #16723d;
      --green-soft: #e9f7ec;
      --paper: #fffef9;
      --ink: #172219;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Inter", sans-serif;
      color: var(--ink);
    }

    .font-judul {
      font-family: "EB Garamond", Georgia, serif;
    }

    .app-shell {
      width: 100%;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      background:
        radial-gradient(circle at 12% 16%, rgba(190, 231, 199, .7), transparent 31rem),
        linear-gradient(135deg, #effaf1 0%, #dcefe1 100%);
    }

    .a4-sheet {
      position: relative;
      width: min(100%, 1123px);
      aspect-ratio: 297 / 210;
      background: var(--paper);
      box-shadow: 0 24px 60px rgba(18, 65, 35, .21);
      overflow: hidden;
    }

    .cover-inner {
      position: absolute;
      inset: 0;
      padding: 12mm 12mm 12mm 28mm;
    }

    .cover-border {
      position: absolute;
      inset: 12mm 12mm 12mm 28mm;
      border: 2.4px solid var(--green-dark);
      pointer-events: none;
    }

    .cover-border::after {
      content: "";
      position: absolute;
      inset: 5px;
      border: 1px solid #85ad8d;
    }

    .binding-guide {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 28mm;
      border-right: 1px dashed rgba(20, 83, 45, .38);
      background: linear-gradient(90deg, rgba(22, 114, 61, .08), rgba(22, 114, 61, .015));
      pointer-events: none;
    }

    .binding-guide span {
      position: absolute;
      left: 7px;
      top: 50%;
      transform: rotate(-90deg) translateX(-50%);
      transform-origin: left top;
      white-space: nowrap;
      color: rgba(20, 83, 45, .6);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .identity-line {
      min-width: 0;
      border-bottom: 1.5px dashed rgba(20, 83, 45, .52);
    }

    .identity-input {
      width: 100%;
      border: 0;
      outline: none;
      background: transparent;
      padding: .28rem 0;
      color: #172219;
      font-size: clamp(.68rem, 1.1vw, .94rem);
      font-weight: 600;
    }

    .identity-input::placeholder {
      color: #8b9a8d;
      font-weight: 400;
    }

    .identity-textarea {
      min-height: 2.9rem;
      resize: none;
    }

    .seal {
      width: clamp(68px, 9vw, 112px);
      height: clamp(68px, 9vw, 112px);
      border: 3px solid var(--green-dark);
      outline: 1px solid #88b294;
      outline-offset: 5px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--green-dark);
      background: #f5fff6;
    }

    .print-only { display: none; }

    @page {
      size: A4 landscape;
      margin: 0;
    }

    @media print {
      html, body {
        width: 297mm;
        height: 210mm;
        background: #fff !important;
      }

      .no-print { display: none !important; }

      .print-only { display: block; }

      .app-shell {
        min-height: 0 !important;
        background: #fff !important;
      }

      .print-stage {
        padding: 0 !important;
        margin: 0 !important;
      }

      .a4-sheet {
        width: 297mm !important;
        height: 210mm !important;
        aspect-ratio: auto !important;
        box-shadow: none !important;
        margin: 0 !important;
      }

      .binding-guide {
        display: none !important;
      }

      .cover-inner {
        padding: 12mm 12mm 12mm 28mm !important;
      }

      .cover-border {
        inset: 12mm 12mm 12mm 28mm !important;
      }

      .identity-input {
        font-size: 10pt !important;
      }
    }
  </style>

     </div>
    </div>
   </header>
   <main class="print-stage mx-auto w-full max-w-7xl px-4 py-7 sm:px-6">

      <div class="binding-guide no-print" aria-hidden="true">
       <span>Ruang Jilid · 28 mm</span>
      </div>
      <div class="cover-border" aria-hidden="true"></div>
      <div class="cover-inner">

        <div class="flex items-start justify-between gap-4">

          <p data-template-id="cover-document-label" class="canva-text text-[clamp(8px,1vw,12px)] font-bold uppercase tracking-[.24em]"></p>

           </div>
          </div>
         </div>
         <div>

          <p data-template-id="cover-subtitle" class="canva-text mt-2 text-[clamp(10px,1.35vw,16px)] font-bold uppercase tracking-[.18em]"></p>

         </div>
        </div>
        <section data-template-id="identity-panel" class="canva-panel rounded-xl border p-4 sm:p-5">

         <div class="grid gap-x-7 gap-y-3 md:grid-cols-2">
          <div class="grid grid-cols-[clamp(88px,13vw,145px)_1fr] items-end gap-3">
           <label data-template-id="label-teacher" class="canva-text text-[clamp(9px,1vw,12px)] font-bold uppercase tracking-wider" for="teacher-name"></label>

          </div>
          <div class="grid grid-cols-[clamp(88px,13vw,145px)_1fr] items-end gap-3">
           <label data-template-id="label-nip" class="canva-text text-[clamp(9px,1vw,12px)] font-bold uppercase tracking-wider" for="teacher-nip"></label>
           <div class="identity-line">
            <input id="teacher-nip" class="identity-input" type="text" placeholder="Nomor induk pegawai">
           </div>
          </div>
          <div class="grid grid-cols-[clamp(88px,13vw,145px)_1fr] items-end gap-3">

           <div class="identity-line">
            <input id="school" class="identity-input" type="text" placeholder="Nama satuan pendidikan">
           </div>
          </div>
          <div class="grid grid-cols-[clamp(88px,13vw,145px)_1fr] items-end gap-3 md:col-span-2">
           <label data-template-id="label-address" class="canva-text self-start pt-1 text-[clamp(9px,1vw,12px)] font-bold uppercase tracking-wider" for="school-address"></label>
           <div class="identity-line">

           </div>

        </section>
        <footer class="flex items-end justify-between gap-4">

          <p data-template-id="footer-city" class="canva-text mt-1 text-[clamp(9px,1vw,12px)] tracking-[.18em]"></p>

         <div class="text-right">
          <p data-template-id="footer-note" class="canva-text max-w-[180px] text-[clamp(8px,.9vw,11px)] leading-relaxed"></p>
         </div>
        </footer>
       </div>
      </div>
     </article>
    </section>
    <aside class="no-print mx-auto mt-5 max-w-4xl rounded-xl border border-green-900/10 bg-white/75 px-4 py-3 text-center">
     <p data-template-id="print-note" class="canva-text text-xs leading-relaxed"></p>
    </aside>
   </main>
  </div>
  <script>
    (function () {
      const fields = document.querySelectorAll('.identity-input');

      fields.forEach(function (field) {
        const key = 'agenda-guru-cover-' + field.id;
        const saved = localStorage.getItem(key);
        if (saved) field.value = saved;

        field.addEventListener('input', function () {
          localStorage.setItem(key, field.value);
        });
      });

      document.getElementById('preview-button').addEventListener('click', function () {
        document.querySelector('.a4-sheet').scrollIntoView({ behavior: 'smooth', block: 'center' });
      });

      document.getElementById('print-button').addEventListener('click', function () {
        window.print();
      });
    })();
  </script>
