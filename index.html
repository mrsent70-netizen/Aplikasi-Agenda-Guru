        <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-3 flex-wrap">
          <div className="flex items-center gap-3">
            <div className="w-9 h-9 rounded-full bg-green-800 text-white grid place-items-center font-judul font-bold text-lg">A</div>
            <div className="leading-tight">
              <div className="font-semibold text-sm tracking-wide">BUKU AGENDA GURU</div>
              <div className="text-[11px] text-neutral-500">SMPN 13 Bandar Lampung • Kurikulum Merdeka</div>
            </div>
          </div>
          <div className="flex items-center gap-2 flex-wrap">
            <div className="flex p-1 bg-white rounded-full border border-green-200 shadow-sm">
              {[
                { k: 'cover', label: 'COVER', icon: BookOpen },
                { k: 'jadwal', label: 'JADWAL', icon: Clock3 },
                { k: 'agenda', label: 'AGENDA HARIAN', icon: CalendarDays },
              ].map((m) => {
                const Icon = m.icon; const active = tab === m.k;
                return (
                  <button key={m.k} onClick={() => setTab(m.k)} className={`px-3 py-1.5 rounded-full text-xs font-semibold tracking-wide flex items-center gap-1.5 transition ${active ? 'bg-green-700 text-white shadow' : 'text-neutral-600 hover:bg-green-100'}`}>
                    <Icon size={14} /> {m.label}
                  </button>
                );
              })}
            </div>
            <button onClick={cetakSemua} className="px-3 py-1.5 rounded-full bg-green-800 text-white text-xs font-bold inline-flex items-center gap-1.5 shadow"><Printer size={14}/> CETAK SEMUA (LANDSCAPE)</button>
            <span className="hidden md:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-white border border-green-200 text-xs font-medium text-neutral-500">{statusLabel}</span>
          </div>
        </div>
      </div>

      <div className="max-w-6xl mx-auto px-4 py-6 md:py-8">
        {tab === 'cover' && (
          <div className="print-page max-w-2xl mx-auto bg-green-100 border-2 border-green-700 rounded-2xl shadow-lg overflow-hidden">
            <div className="px-6 md:px-10 pt-8 pb-10">
              <div className="flex justify-center mb-4"><img src="https://i.ibb.co.com/Zz9dbRD/logosmp13.png" alt="Logo" className="w-20 h-20 md:w-24 md:h-24 object-contain"/></div>
              <div className="text-center font-judul">
                <h1 className="text-3xl md:text-5xl font-bold text-neutral-900">AGENDA GURU</h1>
                <h2 className="mt-1 text-base md:text-xl tracking-[0.2em] font-semibold text-green-800">TUGAS MENGAJAR</h2>
                <div className="mt-3 w-24 h-1 bg-green-800 mx-auto rounded-full" />
              </div>
              <div className="mt-8 bg-white/80 border-2 border-green-700 rounded-xl p-5 md:p-8 space-y-5">
                {[
                  { label: 'Nama Guru', key: 'namaGuru', placeholder: 'Nama lengkap dengan gelar' },
                  { label: 'NIP / NUPTK', key: 'nip', placeholder: 'Nomor induk pegawai' },
                  { label: 'Mata Pelajaran', key: 'mapel', placeholder: 'Contoh: Matematika' },
                  { label: 'Nama Sekolah', key: 'sekolah', placeholder: 'Nama satuan pendidikan' },
                  { label: 'Alamat Sekolah', key: 'alamat', placeholder: 'Alamat lengkap sekolah', multiline: true },
                ].map((f) => (
                  <div key={f.key} className="flex flex-col md:flex-row md:items-end gap-2">
                    <div className="md:w-36 shrink-0 text-[11px] font-bold tracking-widest uppercase text-neutral-500">{f.label}</div>
                    <div className="flex-1 border-b-2 border-dashed border-green-700/60 pb-1">
                      {f.multiline ? (
                        <textarea value={cover[f.key]} onChange={(e) => setCover({ ...cover, [f.key]: e.target.value })} placeholder={f.placeholder} rows={2} className="w-full bg-transparent outline-none resize-none text-sm md:text-base font-medium"/>
                      ) : (
                        <input value={cover[f.key]} onChange={(e) => setCover({ ...cover, [f.key]: e.target.value })} placeholder={f.placeholder} className="w-full bg-transparent outline-none text-sm md:text-base font-medium"/>
                      )}
                    </div>
                  </div>
                ))}
              </div>
              <div className="mt-6 flex flex-wrap gap-2 no-print">
                <span className="inline-flex items-center gap-1.5 px-4 py-2 rounded-full bg-green-700 text-white text-xs font-semibold"><Save size={14} /> {statusLabel}</span>
                <button onClick={exportJson} className="inline-flex items-center gap-1.5 px-4 py-2 rounded-full bg-white border border-green-300 text-xs font-medium"><Download size={14} /> Ekspor JSON</button>
                <button onClick={cetakSemua} className="inline-flex items-center gap-1.5 px-4 py-2 rounded-full bg-green-800 text-white text-xs font-bold"><Printer size={14}/> Cetak Cover Landscape</button>
              </div>
            </div>
          </div>
        )}

        {tab === 'jadwal' && (
          <div className="print-page space-y-8">
            <div className="bg-white border border-green-200 rounded-2xl p-4 md:p-6 text-xs md:text-sm leading-relaxed text-neutral-600">
              Jadwal setiap hari independen: jam bisa berbeda per hari. Baris istirahat/MBG ditandai No "-".
            </div>
            {['ganjil'].map((sem) => (
              <div key={sem} className="bg-green-100 border border-green-200 rounded-2xl p-4 md:p-6">
                <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
                  <h3 className="font-judul text-xl md:text-2xl font-bold text-neutral-900">JADWAL MENGAJAR SEMESTER {sem.toUpperCase()}</h3>
                  <div className="flex items-center gap-2 text-xs"><span className="text-neutral-500">Tahun Pelajaran:</span><input value={jadwal[sem].tp} onChange={(e) => setTp(sem, e.target.value)} className="w-28 px-2 py-1 rounded-full border border-green-300 bg-white outline-none text-xs font-semibold"/></div>
                </div>
                <div className="flex gap-3 overflow-x-auto pb-2">
                  {DAYS.map((day) => {
                    const rows = jadwal[sem].days[day];
                    return (
                      <div key={day} className="bg-white rounded-xl border border-green-300 overflow-hidden flex-shrink-0" style={{ minWidth: 230 }}>
                        <div className="px-3 py-2 bg-green-700 text-white flex items-center justify-between"><span className="font-bold text-xs tracking-widest">{day.toUpperCase()} - {rows.length} SESI</span><button onClick={() => addRow(sem, day)} className="p-1 rounded-full hover:bg-white/20 no-print"><Plus size={13} /></button></div>
                        <table className="w-full text-[11px] border-collapse"><thead><tr className="bg-green-50 text-neutral-500"><th className="p-1 border border-green-100 w-7">No</th><th className="p-1 border border-green-100 w-20">Pukul</th><th className="p-1 border border-green-100">Kegiatan / Kelas</th><th className="p-1 border border-green-100 w-5 no-print" /></tr></thead><tbody>{rows.map((row) => { const isBreak = row.no.trim() === '-'; return (<tr key={row.id} className={isBreak ? 'bg-yellow-50' : ''}><td className="border border-green-100 p-0"><input value={row.no} onChange={(e) => updateRow(sem, day, row.id, 'no', e.target.value)} className="w-full text-center py-1 bg-transparent outline-none font-semibold"/></td><td className="border border-green-100 p-0"><input value={row.pukul} onChange={(e) => updateRow(sem, day, row.id, 'pukul', e.target.value)} placeholder="00:00-00:00" className="w-full py-1 px-1 bg-transparent outline-none"/></td><td className="border border-green-100 p-0"><input value={row.kegiatan} onChange={(e) => updateRow(sem, day, row.id, 'kegiatan', e.target.value)} placeholder={isBreak ? '' : 'Kelas'} className={`w-full py-1 px-1 bg-transparent outline-none ${isBreak ? 'italic font-medium text-green-700' : ''}`}/></td><td className="border border-green-100 p-0 text-center no-print"><button onClick={() => removeRow(sem, day, row.id)} className="text-red-500 hover:bg-red-50 rounded p-1"><Trash2 size={11} /></button></td></tr>);})}</tbody></table>
                      </div>
                    );
                  })}
                </div>
                <div className="no-break px-1 pt-6 text-[11px] flex justify-between flex-wrap gap-2"><span className="text-center">Mengetahui,<br/>Kepala SMP Negeri 13 Bandar Lampung<br/><br/><br/><b>Hj. AMAROH, S.Pd.MM</b><br/>NIP. 196711211990032009</span><span className="text-center">Bandar Lampung, Juli 2026<br/>Guru Mata Pelajaran<br/><br/><br/><b>{cover.namaGuru}</b><br/>NIP. {cover.nip}</span></div>
                <div className="mt-4 no-print"><button onClick={cetakSemua} className="px-4 py-2 rounded-full bg-green-800 text-white text-xs font-bold inline-flex items-center gap-1"><Printer size={14}/> Cetak Jadwal Landscape (1 Halaman)</button></div>
              </div>
            ))}
          </div>
        )}

        {tab === 'agenda' && (
          <div className="print-page bg-green-100 border border-green-200 rounded-2xl p-4 md:p-6">
            <div className="flex flex-wrap items-center justify-between gap-3">
              <div><h3 className="font-judul text-xl md:text-2xl font-bold">Agenda Harian Mengajar</h3><p className="text-[11px] text-neutral-500 mt-1">Absensi sekarang bisa ENTER beberapa baris siswa tidak masuk</p></div>
              <div className="no-print flex flex-wrap items-center gap-2">
                <div className="flex items-center gap-1.5 bg-white border border-green-300 rounded-full px-2 py-1"><SearchIcon size={13} className="text-neutral-400" /><input value={filterTeks} onChange={(e) => setFilterTeks(e.target.value)} placeholder="Cari kelas / materi" className="w-36 md:w-44 outline-none text-xs bg-transparent"/></div>
                <input type="date" value={filterTgl} onChange={(e) => setFilterTgl(e.target.value)} className="px-2 py-1.5 rounded-full border border-green-300 bg-white text-xs"/>
                {filterTgl && (<button onClick={() => setFilterTgl('')} className="text-[11px] underline">Reset</button>)}
                <button onClick={addAgenda} className="px-3 py-1.5 rounded-full bg-green-700 text-white text-xs font-semibold inline-flex items-center gap-1"><Plus size={14} /> Tambah Baris</button>
                <button onClick={exportJson} className="px-3 py-1.5 rounded-full bg-white border border-green-300 text-xs font-medium inline-flex items-center gap-1"><Download size={12} /> Ekspor</button>
                <button onClick={cetakSemua} className="px-3 py-1.5 rounded-full bg-green-800 text-white text-xs font-bold inline-flex items-center gap-1"><Printer size={12}/> Cetak Landscape</button>
              </div>
            </div>

            <div className="mt-4 grid md:grid-cols-3 gap-2 text-[11px]">
              <div className="bg-white/80 rounded-lg border border-green-200 p-2"><b>X</b> = Banyak pertemuan untuk 1 KD • <b>Y</b> = Pertemuan ke-</div>
              <div className="bg-white/80 rounded-lg border border-green-200 p-2"><b>FIX:</b> Absensi bisa ENTER contoh:<br/>1. Andre (A)<br/>2. Putri (S)</div>
              <div className="bg-white/80 rounded-lg border border-green-200 p-2">Guru: <b>{cover.namaGuru || '-'}</b> • Mapel: <b>{cover.mapel || '-'}</b> • {totalSlot} slot/minggu</div>
            </div>

            <div className="mt-5 overflow-x-auto rounded-xl border border-green-700 bg-white">
              <table className="w-full text-[11px] border-collapse" style={{ minWidth: 1200 }}>
                <thead>
                  <tr className="bg-green-700 text-white text-[10px] tracking-wide">
                    <th className="p-2 border border-green-800 w-28">Tanggal</th><th className="p-2 border border-green-800 w-16">Jam Ke</th><th className="p-2 border border-green-800 w-24">Kelas</th><th className="p-2 border border-green-800 w-20">No. KD/RPP</th><th className="p-2 border border-green-800" style={{ minWidth: 220 }}>Kompetensi Dasar / Indikator</th><th className="p-2 border border-green-800 w-9">X</th><th className="p-2 border border-green-800 w-9">Y</th><th className="p-2 border border-green-800 w-32">Selesai / Belum + Alasan</th><th className="p-2 border border-green-800 w-40">Absensi Siswa (ENTER)</th><th className="p-2 border border-green-800 w-24">Keterangan</th><th className="p-1 border border-green-800 w-8 no-print" />
                  </tr>
                </thead>
                <tbody>
                  {filteredAgenda.map((row, i) => (
                    <tr key={row.id} className={i % 2 === 0 ? 'bg-white' : 'bg-green-50'}>
                      <td className="border border-green-100 p-0"><input type="date" value={row.tanggal} onChange={(e) => updateAgenda(row.id, 'tanggal', e.target.value)} className="w-full px-1 py-2 bg-transparent outline-none text-[11px]" /></td>
                      <td className="border border-green-100 p-0"><input value={row.jamKe} onChange={(e) => updateAgenda(row.id, 'jamKe', e.target.value)} placeholder="1-2" className="w-full px-1 py-2 bg-transparent outline-none text-center" /></td>
                      <td className="border border-green-100 p-0"><input value={row.kelas} onChange={(e) => updateAgenda(row.id, 'kelas', e.target.value)} placeholder="IX A" className="w-full px-1 py-2 bg-transparent outline-none" /></td>
                      <td className="border border-green-100 p-0"><input value={row.kdRpp} onChange={(e) => updateAgenda(row.id, 'kdRpp', e.target.value)} placeholder="3.1" className="w-full px-1 py-2 bg-transparent outline-none text-center" /></td>
                      <td className="border border-green-100 p-0"><input value={row.kompetensi} onChange={(e) => updateAgenda(row.id, 'kompetensi', e.target.value)} placeholder="KD / indikator" className="w-full px-2 py-2 bg-transparent outline-none" /></td>
                      <td className="border border-green-100 p-0"><input value={row.x} onChange={(e) => updateAgenda(row.id, 'x', e.target.value)} className="w-full text-center py-2 bg-transparent outline-none" /></td>
                      <td className="border border-green-100 p-0"><input value={row.y} onChange={(e) => updateAgenda(row.id, 'y', e.target.value)} className="w-full text-center py-2 bg-transparent outline-none" /></td>
                      <td className="border border-green-100 p-0"><input value={row.selesai} onChange={(e) => updateAgenda(row.id, 'selesai', e.target.value)} placeholder="Selesai / Belum" className="w-full px-1 py-2 bg-transparent outline-none" /></td>
                      <td className="border border-green-100 p-0 align-top" style={{ verticalAlign: 'top' }}>
                        {/* FIX 2: TEXTAREA MULTILINE BISA ENTER */}
                        <textarea
                          value={row.absensi}
                          onChange={(e) => updateAgenda(row.id, 'absensi', e.target.value)}
                          placeholder={"Contoh:\n1. Andre (A)\n2. Putri (S)\n3. Budi (I)"}
                          rows={3}
                          style={{ whiteSpace: 'pre-wrap', minHeight: '60px' }}
                          className="w-full px-2 py-2 bg-transparent outline-none resize-y text-[11px] leading-4"
                        />
                      </td>
                      <td className="border border-green-100 p-0"><input value={row.keterangan} onChange={(e) => updateAgenda(row.id, 'keterangan', e.target.value)} className="w-full px-1 py-2 bg-transparent outline-none" /></td>
                      <td className="border border-green-100 p-0 text-center no-print"><button onClick={() => removeAgenda(row.id)} className="p-1.5 hover:bg-red-50 rounded text-red-500"><Trash2 size={12} /></button></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <div className="mt-3 flex flex-wrap justify-between text-[10px] text-neutral-500 gap-2"><div>Total baris: {filteredAgenda.length} dari {agenda.length}</div><div className="flex gap-4"><span>Paraf Guru: ........................</span><span>Paraf Kepsek: ........................</span></div></div>
          </div>
        )}
      </div>
      <div className="no-print max-w-6xl mx-auto px-4 pb-8 text-center text-[10px] text-neutral-400">Aplikasi Buku Agenda Guru • SMPN 13 Bandar Lampung • Data tersimpan otomatis • FIX Landscape + Absensi Multiline</div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<AgendaGuruApp />);
</script>
<script>
  (function () {
    var src = document.getElementById('app-source').textContent;
    var result = Babel.transform(src, { presets: [['react', { runtime: 'classic' }], 'env'], });
    var script = document.createElement('script'); script.text = result.code; document.body.appendChild(script);
  })();
</script>
</body>
</html>
