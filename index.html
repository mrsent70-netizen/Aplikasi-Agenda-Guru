      {previewMode && (<div className="preview-toolbar"><span className="text-xs font-semibold">👁 Pratinjau Cetak Landscape</span><button onClick={doPrint} className="px-3 py-1.5 rounded-full bg-white text-green-800 text-xs font-semibold">🖨 Cetak / Simpan PDF</button><button onClick={() => setPreviewMode(false)} className="px-3 py-1.5 rounded-full bg-green-700 border border-white/40 text-white text-xs font-semibold">✏ Kembali Edit</button></div>)}
      <div className="no-print sticky top-0 z-30 bg-green-50/95 border-b border-green-200 backdrop-blur">
        <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-3 flex-wrap">
          <div className="flex items-center gap-3"><div className="w-9 h-9 rounded-full bg-green-800 text-white grid place-items-center font-judul font-bold text-lg">A</div><div className="leading-tight"><div className="font-semibold text-sm tracking-wide">BUKU AGENDA GURU</div><div className="text-[11px] text-neutral-500">SMPN 13 Bandar Lampung • Kurikulum Merdeka</div></div></div>
          <div className="flex items-center gap-2">
            <div className="flex flex-wrap p-1 bg-white rounded-full border border-green-200 shadow-sm">
              {[{ k: 'cover', label: 'COVER', icon: BookOpen },{ k: 'jadwal', label: 'JADWAL', icon: Clock3 },{ k: 'siswa', label: 'SISWA', icon: Users },{ k: 'agenda', label: 'AGENDA HARIAN', icon: CalendarDays },].map((m) => { const Icon = m.icon; const active = tab === m.k; return (<button key={m.k} onClick={() => setTab(m.k)} className={`px-3 py-1.5 rounded-full text-xs font-semibold tracking-wide flex items-center gap-1.5 transition ${active ? 'bg-green-700 text-white shadow' : 'text-neutral-600 hover:bg-green-100'}`}><Icon size={14} /> {m.label}</button>); })}
            </div>
            <span className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-white border border-green-200 text-xs font-medium text-neutral-500">{statusLabel}</span>
            {syncLabel && (<span className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-white border border-green-200 text-xs font-medium text-neutral-500">{syncLabel}</span>)}
          </div>
        </div>
      </div>
      <div className="preview-body max-w-6xl mx-auto px-4 py-6 md:py-8">
        {tab === 'cover' && (
          <div className="cover-page-wrap">
          <div id="cover-content" className="mx-auto bg-green-100 border-2 border-green-700 rounded-2xl shadow-lg overflow-hidden cover-card print-avoid-break" style={{maxWidth: 1050, width: '100%'}}>
            <div className="px-6 md:px-10 py-8 flex flex-row items-center gap-6 md:gap-8 cover-grid">
              <div className="flex-shrink-0 text-center cover-left" style={{flex:'0 0 280px'}}>
                <img src="https://i.ibb.co.com/Zz9dbRD/logosmp13.png" alt="Logo SMPN 13 Bandar Lampung" className="w-24 h-24 md:w-28 md:h-28 object-contain mx-auto" />
                <div className="mt-4 font-judul">
                  <h1 className="text-3xl md:text-4xl font-bold text-neutral-900 leading-tight">AGENDA GURU</h1>
                  <h2 className="mt-1 text-sm md:text-base tracking-[0.2em] font-semibold text-green-800">TUGAS MENGAJAR</h2>
                  <div className="mt-3 w-20 h-1 bg-green-800 mx-auto rounded-full" />
                  <p className="mt-3 text-[11px] font-bold text-neutral-700 tracking-wide">SMP NEGERI 13 BANDAR LAMPUNG</p>
                </div>
                <div className="mt-3 text-[10px] tracking-widest uppercase text-neutral-500 font-tubuh">Dokumen resmi guru<br/>Diisi setiap hari mengajar</div>
              </div>
              <div className="flex-1 w-full bg-white/90 border-2 border-green-700 rounded-xl p-5 md:p-6 space-y-3 cover-right">
                {[{ label: 'Nama Guru', key: 'namaGuru', placeholder: 'Nama lengkap dengan gelar' },{ label: 'NIP / NUPTK', key: 'nip', placeholder: 'Nomor induk pegawai' },{ label: 'Mata Pelajaran', key: 'mapel', placeholder: 'Contoh: Matematika' },{ label: 'Nama Sekolah', key: 'sekolah', placeholder: 'SMP Negeri 13 Bandar Lampung' },{ label: 'Alamat Sekolah', key: 'alamat', placeholder: 'Alamat lengkap sekolah', multiline: true },].map((f) => (
                  <div key={f.key} className="flex flex-col md:flex-row md:items-end gap-2">
                    <div className="md:w-36 shrink-0 text-[11px] font-bold tracking-widest uppercase text-neutral-500">{f.label}</div>
                    <div className="flex-1 border-b-2 border-dashed border-green-700/60 pb-1">
                      {f.multiline ? (<textarea value={cover[f.key]} onChange={(e) => setCover({ ...cover, [f.key]: e.target.value })} placeholder={f.placeholder} rows={3} className="w-full bg-transparent outline-none resize-none text-sm font-medium" />) : (<input value={cover[f.key]} onChange={(e) => setCover({ ...cover, [f.key]: e.target.value })} placeholder={f.placeholder} className="w-full bg-transparent outline-none text-sm font-medium" />)}
                    </div>
                  </div>
                ))}
              </div>
            </div>
            <div className="pb-6 flex flex-wrap justify-center gap-2 no-print">
              <span className="inline-flex items-center gap-1.5 px-4 py-2 rounded-full bg-green-700 text-white text-xs font-semibold"><Save size={14} /> {statusLabel}</span>
              <button onClick={exportJson} className="inline-flex items-center gap-1.5 px-4 py-2 rounded-full bg-white border border-green-300 text-xs font-medium"><Download size={14} /> Ekspor JSON</button>
              <button onClick={doPrint} className="inline-flex items-center gap-1.5 px-4 py-2 rounded-full bg-white border border-green-300 text-xs font-medium">🖨 Cetak Landscape</button>
              <button onClick={() => setPreviewMode(true)} className="inline-flex items-center gap-1.5 px-4 py-2 rounded-full bg-green-700 text-white text-xs font-medium">👁 Pratinjau</button>
            </div>
          </div>
          </div>
        )}
        {tab === 'jadwal' && (
          <div id="jadwal-content" className="space-y-6">
            <div className="bg-white border border-green-200 rounded-2xl p-4 text-xs leading-relaxed text-neutral-600 no-print flex flex-wrap items-center justify-between gap-3"><span>Jadwal independen per hari - bisa beda jam masuk/pulang</span><div className="flex gap-2"><button onClick={doPrint} className="px-4 py-2 rounded-full bg-white border border-green-300 text-xs">🖨 Cetak</button><button onClick={() => setPreviewMode(true)} className="px-4 py-2 rounded-full bg-green-700 text-white text-xs">👁 Pratinjau</button></div></div>
            {['ganjil','genap'].map((sem) => (<div key={sem} className="bg-green-100 border border-green-200 rounded-2xl p-4 print-avoid-break"><div className="flex flex-wrap items-center justify-between gap-3 mb-3"><h3 className="font-judul text-lg font-bold">JADWAL MENGAJAR SEMESTER {sem.toUpperCase()}</h3><div className="flex items-center gap-2 text-xs"><span>TP:</span><input value={jadwal[sem].tp} onChange={(e) => setTp(sem, e.target.value)} className="w-28 px-2 py-1 rounded-full border border-green-300 bg-white text-xs font-semibold"/></div></div><div className="flex gap-2 overflow-x-auto pb-2">{DAYS.map((day) => { const rows = jadwal[sem].days[day]; return (<div key={day} className="bg-white rounded-xl border border-green-300 overflow-hidden flex-shrink-0 day-card" style={{minWidth:210}}><div className="px-2 py-1.5 bg-green-700 text-white flex items-center justify-between"><span className="font-bold text-[10px] tracking-widest">{day.toUpperCase()}</span><button onClick={() => addRow(sem, day)} className="p-1 rounded-full hover:bg-white/20 no-print"><Plus size={11} /></button></div><table className="w-full text-[10px] border-collapse"><thead><tr className="bg-green-50"><th className="p-1 border border-green-100">No</th><th className="p-1 border border-green-100">Pukul</th><th className="p-1 border border-green-100">Kelas</th><th className="p-1 border border-green-100 w-4 no-print"></th></tr></thead><tbody>{rows.map((row) => { const isBreak = row.no.trim() === '-'; return (<tr key={row.id} className={isBreak ? 'bg-yellow-50' : ''}><td className="border border-green-100 p-0"><input value={row.no} onChange={(e) => updateRow(sem, day, row.id, 'no', e.target.value)} className="w-full text-center py-1 bg-transparent outline-none font-semibold"/></td><td className="border border-green-100 p-0"><input value={row.pukul} onChange={(e) => updateRow(sem, day, row.id, 'pukul', e.target.value)} className="w-full py-1 px-1 bg-transparent outline-none"/></td><td className="border border-green-100 p-0"><input value={row.kegiatan} onChange={(e) => updateRow(sem, day, row.id, 'kegiatan', e.target.value)} className={`w-full py-1 px-1 bg-transparent outline-none ${isBreak ? 'italic text-green-700' : ''}`}/></td><td className="border border-green-100 p-0 text-center no-print"><button onClick={() => removeRow(sem, day, row.id)} className="text-red-500"><Trash2 size={10} /></button></td></tr>);})}</tbody></table></div>);})}</div><TandaTangan cover={cover} /></div>))}
          </div>
        )}
        {tab === 'siswa' && (
          <div className="space-y-4"><div className="bg-white border border-green-200 rounded-2xl p-4 text-xs">Daftar nama siswa per kelas - dipakai untuk absensi H/S/I/A</div><div className="bg-green-100 border border-green-200 rounded-2xl p-4"><div className="flex flex-wrap gap-2 items-center mb-4"><input value={kelasBaru} onChange={(e) => setKelasBaru(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && addKelas()} placeholder="Nama kelas baru, contoh: IX A" className="px-3 py-2 rounded-full border border-green-300 bg-white text-sm flex-1 min-w-[180px]"/><button onClick={addKelas} className="px-4 py-2 rounded-full bg-green-700 text-white text-xs font-semibold"><Plus size={14} /> Tambah Kelas</button></div><div className="grid md:grid-cols-2 gap-4">{Object.entries(siswa).map(([namaKelas, daftar]) => (<div key={namaKelas} className="bg-white rounded-xl border border-green-300 overflow-hidden"><div className="px-3 py-2 bg-green-700 text-white flex items-center justify-between"><span className="font-bold text-xs">{namaKelas.toUpperCase()} • {daftar.length} siswa</span><button onClick={() => removeKelas(namaKelas)} className="p-1 rounded-full hover:bg-white/20"><Trash2 size={13} /></button></div><textarea defaultValue={daftar.join('\n')} onBlur={(e) => setRosterText(namaKelas, e.target.value)} placeholder={'Satu nama per baris'} rows={8} className="w-full p-3 text-sm outline-none resize-none" /></div>))}</div></div></div>
        )}
        {tab === 'agenda' && (
          <div id="agenda-content" className="bg-green-100 border border-green-200 rounded-2xl p-4">
            <div className="flex flex-wrap items-center justify-between gap-3"><div><h3 className="font-judul text-xl font-bold">Agenda Harian Mengajar</h3><p className="text-[11px] text-neutral-500 no-print">Absensi bisa ENTER beberapa siswa</p></div><div className="no-print flex flex-wrap items-center gap-2"><div className="flex items-center gap-1.5 bg-white border border-green-300 rounded-full px-2 py-1"><SearchIcon size={13} /><input value={filterTeks} onChange={(e) => setFilterTeks(e.target.value)} placeholder="Cari kelas" className="w-32 outline-none text-xs bg-transparent"/></div><input type="date" value={filterTgl} onChange={(e) => setFilterTgl(e.target.value)} className="px-2 py-1.5 rounded-full border border-green-300 bg-white text-xs"/>{filterTgl && (<button onClick={() => setFilterTgl('')} className="text-[11px] underline">Reset</button>)}<button onClick={addAgenda} className="px-3 py-1.5 rounded-full bg-green-700 text-white text-xs"><Plus size={14} /> Tambah</button><button onClick={exportJson} className="px-3 py-1.5 rounded-full bg-white border border-green-300 text-xs">Ekspor</button><button onClick={doPrint} className="px-3 py-1.5 rounded-full bg-white border border-green-300 text-xs">🖨 Cetak</button><button onClick={() => setPreviewMode(true)} className="px-3 py-1.5 rounded-full bg-green-700 text-white text-xs">👁 Pratinjau</button></div></div>
            <div className="mt-4 overflow-x-auto rounded-xl border border-green-700 bg-white"><table className="w-full text-[11px] border-collapse"><thead><tr className="bg-green-700 text-white text-[10px]"><th className="p-2 border border-green-800 w-28">Tanggal</th><th className="p-2 border border-green-800 w-16">Jam Ke</th><th className="p-2 border border-green-800 w-20">Kelas</th><th className="p-2 border border-green-800 w-16">KD/RPP</th><th className="p-2 border border-green-800" style={{minWidth:180}}>Kompetensi</th><th className="p-2 border border-green-800 w-7">X</th><th className="p-2 border border-green-800 w-7">Y</th><th className="p-2 border border-green-800 w-24">Selesai</th><th className="p-2 border border-green-800" style={{minWidth:200}}>Absensi Siswa (ENTER)</th><th className="p-1 border border-green-800 w-8 no-print"></th></tr></thead><tbody>{filteredAgenda.map((row, i) => (<tr key={row.id} className={i % 2 === 0 ? 'bg-white' : 'bg-green-50'}><td className="border border-green-100 p-0"><input type="date" value={row.tanggal} onChange={(e) => updateAgenda(row.id, 'tanggal', e.target.value)} className="w-full px-1 py-2 bg-transparent outline-none text-[11px]"/></td><td className="border border-green-100 p-0"><input value={row.jamKe} onChange={(e) => updateAgenda(row.id, 'jamKe', e.target.value)} className="w-full px-1 py-2 bg-transparent outline-none text-center"/></td><td className="border border-green-100 p-0"><input list="daftar-kelas" value={row.kelas} onChange={(e) => updateAgenda(row.id, 'kelas', e.target.value)} className="w-full px-1 py-2 bg-transparent outline-none"/></td><td className="border border-green-100 p-0"><input value={row.kdRpp} onChange={(e) => updateAgenda(row.id, 'kdRpp', e.target.value)} className="w-full px-1 py-2 bg-transparent outline-none text-center"/></td><td className="border border-green-100 p-0"><input value={row.kompetensi} onChange={(e) => updateAgenda(row.id, 'kompetensi', e.target.value)} className="w-full px-2 py-2 bg-transparent outline-none"/></td><td className="border border-green-100 p-0"><input value={row.x} onChange={(e) => updateAgenda(row.id, 'x', e.target.value)} className="w-full text-center py-2 bg-transparent outline-none"/></td><td className="border border-green-100 p-0"><input value={row.y} onChange={(e) => updateAgenda(row.id, 'y', e.target.value)} className="w-full text-center py-2 bg-transparent outline-none"/></td><td className="border border-green-100 p-0"><input value={row.selesai} onChange={(e) => updateAgenda(row.id, 'selesai', e.target.value)} className="w-full px-1 py-2 bg-transparent outline-none"/></td><td className="border border-green-100 p-0"><div className="flex items-start gap-1"><textarea value={row.absensi} onChange={(e) => updateAgenda(row.id, 'absensi', e.target.value)} placeholder="Hadir, atau klik ikon" rows={Math.max(2, (row.absensi.match(/\n/g) || []).length + 1)} className="w-full px-1 py-2 bg-transparent outline-none text-[11px] resize-none"></textarea><button onClick={() => setOpenAbsenId(row.id)} className="no-print shrink-0 mt-1 p-1 rounded hover:bg-green-100 text-green-700"><Users size={13} /></button></div></td><td className="border border-green-100 p-0 text-center no-print"><button onClick={() => removeAgenda(row.id)} className="p-1.5 hover:bg-red-50 rounded text-red-500"><Trash2 size={12} /></button></td></tr>))}</tbody></table><datalist id="daftar-kelas">{Object.keys(siswa).map((k) => (<option key={k} value={k} />))}</datalist></div><TandaTangan cover={cover} /></div>
        )}
      </div>
      {rowOpen && (<PanelAbsensi row={rowOpen} roster={siswa[rowOpen.kelas] || []} onUpdateStatus={(nama, st) => updateAbsenStatus(rowOpen.id, nama, st)} onApply={() => applyAbsen(rowOpen.id)} onClose={() => setOpenAbsenId(null)} onGoToSiswa={() => { setKelasBaru(rowOpen.kelas || ''); setOpenAbsenId(null); setTab('siswa'); }} />)}
      <div className="no-print max-w-6xl mx-auto px-4 pb-8 text-center text-[10px] text-neutral-400">Aplikasi Buku Agenda Guru • SMPN 13 Bandar Lampung • Data tersimpan otomatis</div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<AgendaGuruApp />);
</script>
<script>
  (function () {
    var src = document.getElementById('app-source').textContent;
    var result = Babel.transform(src, { presets: [['react', { runtime: 'classic' }], 'env'] });
    var script = document.createElement('script'); script.text = result.code; document.body.appendChild(script);
  })();
</script>
</body>
</html>
